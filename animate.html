<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sulat · Show me</title>
<script>
  // Runs before anything is drawn, so the glasses never flash the light page layout.
  if (/[?&]view=glasses(&|$)/.test(window.location.search)) { document.documentElement.className += ' glasses'; }
</script>
<style>
  :root {
    --page: #eceff3;
    --card: #ffffff;
    --ink: #14161a;
    --quiet: #5d6572;
    --line: #d9dde3;
    --accent: #1f3a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 16px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  h1 { margin: 4px 0 2px; font: 400 30px Georgia, "Times New Roman", serif; }
  .lede { margin: 0 0 16px; color: var(--quiet); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input[type="text"] {
    flex: 1 1 260px;
    min-height: 48px;
    padding: 0 14px;
    font: inherit;
    font-size: 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  button, .btn {
    font: inherit;
    min-height: 48px;
    padding: 0 18px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    touch-action: manipulation;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
  button:focus-visible, input:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .starters { margin-top: 12px; }
  .starters button { min-height: 44px; }
  .starters small { color: var(--quiet); margin-left: 6px; }
  #stage svg { display: block; width: 100%; height: auto; max-height: 340px; color: var(--ink); }
  #stage .label { fill: var(--quiet); font-family: -apple-system, Helvetica, Arial, sans-serif; }
  #stage .label.active { fill: var(--accent); font-weight: 700; }
  #syllables { margin: 12px 0 4px; font-size: 20px; letter-spacing: 0.02em; }
  #breakdown { margin: 6px 0 0; padding-left: 20px; color: var(--quiet); }
  #status { min-height: 1.4em; color: var(--quiet); margin: 8px 0 0; }

  /* Glasses view: 600x600, black is see-through on the Display. Lines, not fills.
     Fonts are local files so Show me never needs the network beyond the pack. */
  @font-face { font-family: 'Figtree'; src: url('fonts/figtree.woff2') format('woff2'); font-weight: 300 900; font-display: swap; }
  @font-face { font-family: 'Caveat'; src: url('fonts/caveat.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
  html.glasses, html.glasses body { background: #000; color: #F5ECD7; }
  html.glasses .wrap { display: none; }
  #lens { display: none; }
  html.glasses #lens {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    box-sizing: border-box;
    width: min(100vw, 600px);
    height: min(100vh, 600px);
    margin: 0 auto;
    padding: 22px 30px;
    font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #F5ECD7;
  }
  #lensTop { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
  #lensLogo { height: 40px; width: auto; display: block; opacity: 0.92; }
  #lensGloss { font-size: 20px; white-space: nowrap; }
  #lensPhrase { color: #FFFFFF; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  #lensGloss .sep { margin: 0 10px; color: rgba(245,236,215,0.45); }
  #lensMeaning { color: rgba(245,236,215,0.75); }
  #lensChips { display: flex; justify-content: center; align-items: center; gap: 6px; }
  .chip {
    height: 38px; min-width: 38px; padding: 0 8px; box-sizing: border-box; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600;
    border: 2px solid rgba(245,236,215,0.4); color: rgba(245,236,215,0.4);
  }
  .chip.done { border-color: #C5E3A1; color: #C5E3A1; }
  .chip.cur { border: 3px solid #F5ECD7; border-bottom: 6px solid #FF8E72; color: #F5ECD7; font-weight: 700; }
  .chipGap { width: 8px; flex: none; }
  #lensWord { font-size: 30px; font-weight: 600; text-wrap: balance; }
  #lensCount { font-size: 24px; }
  #lensStage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #lensStage svg { display: block; width: 100%; height: 100%; max-height: 280px; color: #F5ECD7; }
  #lensStage .mark { color: #FF8E72; }
  #lensLabel { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  #lensSyl { font-size: 44px; font-weight: 700; line-height: 1; color: #FFFFFF; }
  #lensNote { font-size: 22px; line-height: 1.3; color: rgba(245,236,215,0.88); min-height: 1.3em; }
  #lensNote .hl { color: #FF8E72; font-weight: 600; }
  #lensBottom { display: flex; justify-content: center; align-items: flex-start; gap: 12px; }
  .key, #lensReplay { width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .key .cap, #lensReplay .cap {
    width: 64px; height: 40px; box-sizing: border-box; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #F5ECD7; border: 2px solid rgba(245,236,215,0.5);
    transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
  }
  #lensReplay .cap { font-size: 17px; font-weight: 700; }
  .key .lbl, #lensReplay .lbl { font-size: 18px; color: rgba(245,236,215,0.8); white-space: nowrap; transition: color 0.15s; }
  .key.off { visibility: hidden; }
  /* The one real button: Enter (or Neural Band Select) always presses it. */
  #lensReplay { background: transparent; border: 0; padding: 0; margin: 0; font: inherit; cursor: pointer; }
  #lensReplay:focus, #lensReplay:focus-visible { outline: none; }
  #lensReplay:disabled { opacity: 0.55; cursor: default; }
  /* Gold flashes on the key you just pressed. */
  .key.pressed .cap, #lensReplay.pressed .cap { border-color: #F6C85C; color: #F6C85C; box-shadow: 0 0 0 3px rgba(246,200,92,0.28); }
  .key.pressed .lbl, #lensReplay.pressed .lbl { color: #F6C85C; }
  /* Each mode shows only what it needs. */
  #lens[data-mode="show"] #lensWord, #lens[data-mode="show"] #lensCount { display: none; }
  #lens:not([data-mode="show"]) #lensSyl { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Show me</h1>
  <p class="lede">Type a word or phrase in Tagalog and watch it written in Baybayin, stroke by stroke, in the order the strokes are drawn.</p>

  <div class="card">
    <div class="row">
      <label for="phrase" style="position:absolute;left:-9999px">Phrase</label>
      <input id="phrase" type="text" value="mahal kita" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="go" type="button" class="primary">Show me</button>
      <button id="replay" type="button">Replay</button>
    </div>
    <div class="row starters" id="starters"></div>
  </div>

  <div class="card">
    <div id="stage" aria-live="polite"></div>
    <p id="syllables"></p>
    <ul id="breakdown"></ul>
    <div class="row" style="margin-top:12px">
      <button id="slow" type="button" aria-pressed="false">Slow</button>
      <a id="lensLink" class="btn" href="#">Open glasses view</a>
    </div>
    <p id="status" role="status"></p>
  </div>
</div>

<div id="lens" aria-live="polite" data-mode="show">
  <div id="lensTop">
    <img id="lensLogo" src="img/wordmark-cream.png" alt="Sulat">
    <span id="lensGloss"><span id="lensPhrase"></span><span class="sep">|</span><span id="lensMeaning"></span></span>
  </div>
  <div id="lensChips" aria-label="Progress through the phrase"></div>
  <div id="lensWord"></div>
  <div id="lensCount"></div>
  <div id="lensStage"></div>
  <div id="lensLabel"><span id="lensSyl"></span><div id="lensNote"></div></div>
  <div id="lensBottom">
    <div class="key" id="keyUp"><span class="cap">&#8593;</span><span class="lbl">Phrases</span></div>
    <div class="key" id="keyDown"><span class="cap">&#8595;</span><span class="lbl">Write it</span></div>
    <div class="key" id="keyLeft"><span class="cap">&#8592;</span><span class="lbl">Prev</span></div>
    <button id="lensReplay" type="button"><span class="cap">Enter</span><span class="lbl" id="lensReplayLabel">Replay</span></button>
    <div class="key" id="keyRight"><span class="cap">&#8594;</span><span class="lbl">Next</span></div>
  </div>
  <div id="lensHint" hidden></div>
</div>

<script src="sulat-engine.js"></script>
<script>
(function () {
  'use strict';

  var STARTERS = [
    { text: 'mahal kita', en: 'I love you' },
    { text: 'salamat', en: 'thank you' },
    { text: 'kumusta', en: 'how are you' },
    { text: 'magandang umaga', en: 'good morning' },
    { text: 'paalam', en: 'goodbye' }
  ];

  // Built with Muse Code: Tagalog voice clips recorded by my mother.
  // Sound never blocks the lesson: a failed play is silently ignored.
  var AUDIO_PHRASES = { 'mahal kita': 1, salamat: 1, kumusta: 1, 'magandang umaga': 1, paalam: 1 };
  function playAudio(name) {
    try {
      var p = new Audio('audio/' + name + '.mp3').play();
      if (p && p.catch) { p.catch(function () { /* no sound: keep going */ }); }
    } catch (e) { /* audio unsupported: keep going */ }
  }
  function playPhrase(text) {
    var key = String(text || '').toLowerCase().trim().replace(/\s+/g, ' ');
    if (AUDIO_PHRASES[key]) { playAudio(key.replace(/ /g, '-')); }
  }
  var lastPhraseAudio = '';
  function playPhraseOnce(text) {
    var key = String(text || '').toLowerCase().trim().replace(/\s+/g, ' ');
    if (key && key !== lastPhraseAudio) { lastPhraseAudio = key; playPhrase(key); }
  }

  var params = new URLSearchParams(window.location.search);
  var glasses = params.get('view') === 'glasses';
  document.documentElement.classList.toggle('glasses', glasses);

  var $ = function (id) { return document.getElementById(id); };
  var input = $('phrase');
  if (params.get('text')) { input.value = params.get('text'); }

  var pack = null;
  var ctrl = null;
  var words = [];
  var unitIndex = 0;
  var speed = params.get('speed') === 'slow' ? 0.55 : (glasses ? 0.7 : 1);
  $('slow').setAttribute('aria-pressed', speed < 1 ? 'true' : 'false');

  function status(msg) { $('status').textContent = msg; }

  // Built with Muse Code: glasses loop. The lenses never touch the network for
  // anything but this room: they post a capture command, the desk phone answers.
  var lensMode = 'show'; // show | try | checking | verdict
  var lensTimer = 0;
  var pendingCmd = null;
  var tryTok = '';
  var roomCode = null;
  if (glasses) {
    var qroom = params.get('room');
    if (qroom && /^[A-Za-z0-9]{4,8}$/.test(qroom)) {
      roomCode = qroom.toUpperCase();
      try { window.localStorage.setItem('sulat.room', roomCode); } catch (e) { /* private mode */ }
    } else {
      try { roomCode = window.localStorage.getItem('sulat.room'); } catch (e) { roomCode = null; }
      if (roomCode) { roomCode = String(roomCode).toUpperCase(); }
      if (!roomCode || !/^[A-Z0-9]{4,8}$/.test(roomCode)) { roomCode = null; }
    }
    if (!roomCode) {
      roomCode = String(Math.floor(1000 + Math.random() * 9000));
      try { window.localStorage.setItem('sulat.room', roomCode); } catch (e) { /* private mode */ }
    }
  }

  function highlighter(labels) {
    return function (i) {
      labels().forEach(function (n, k) { n.classList.toggle('active', k === i); });
    };
  }

  function updateLensLink() {
    var q = new URLSearchParams({ view: 'glasses', text: input.value });
    if (speed < 1) { q.set('speed', 'slow'); }
    $('lensLink').href = '?' + q.toString();
  }

  function renderPhrase() {
    if (!pack) { return; }
    words = Sulat.syllabify(input.value);
    updateLensLink();
    if (!words.length) { $('stage').innerHTML = ''; $('syllables').textContent = ''; $('breakdown').innerHTML = ''; return; }
    var lay = Sulat.layout(pack, words);
    var c = null;
    c = Sulat.render($('stage'), pack, lay, {
      labels: true,
      ariaLabel: input.value + ' in Baybayin',
      onGlyph: highlighter(function () { return c ? c.labels : []; })
    });
    ctrl = c;

    $('syllables').textContent = words.map(function (w) {
      return w.tokens.map(function (t) { return t.text; }).join(' · ');
    }).join('   ');
    var list = $('breakdown');
    list.innerHTML = '';
    words.forEach(function (w) {
      w.tokens.forEach(function (t) {
        var li = document.createElement('li');
        li.textContent = Sulat.describe(t);
        list.appendChild(li);
      });
    });
    status(lay.missing.length ? 'Missing from the stroke pack: ' + lay.missing.join(', ') : '');
    ctrl.play({ speed: speed });
    playPhrase(input.value);
  }

  // On the glasses each syllable gets its own screen, so it stays large and learners can follow.
  function lensUnits() {
    var out = [];
    words.forEach(function (w, wi) {
      w.tokens.forEach(function (t) { out.push({ word: w.text, wi: wi, tok: t }); });
    });
    return out;
  }

  // Glasses header: the phrase's meaning, the syllable chips, and a plain note that highlights the mark.
  function glossFor(text) {
    var key = String(text || '').toLowerCase().trim().replace(/\s+/g, ' ');
    for (var k = 0; k < STARTERS.length; k++) { if (STARTERS[k].text === key) { return STARTERS[k].en; } }
    return '';
  }
  function renderChips(units, idx) {
    var box = $('lensChips');
    box.innerHTML = '';
    units.forEach(function (un, k) {
      if (k > 0 && un.wi !== units[k - 1].wi) {
        var gap = document.createElement('span');
        gap.className = 'chipGap';
        box.appendChild(gap);
      }
      var c = document.createElement('span');
      c.className = 'chip' + (k < idx ? ' done' : (k === idx ? ' cur' : ''));
      c.textContent = un.tok.text;
      box.appendChild(c);
    });
  }
  function noteHtml(tok) {
    var t = Sulat.describe(tok).replace(/^[^:]*:\s*/, '');
    return escLensTip(t).replace(/(dot above|dot below|cross below)/, '<span class="hl">$1</span>');
  }

  function renderLensUnit() {
    if (!pack) { return; }
    words = Sulat.syllabify(input.value);
    var units = lensUnits();
    if (!units.length) { return; }
    unitIndex = (unitIndex + units.length) % units.length;
    lensMode = 'show';
    clearTimeout(lensTimer);
    var u = units[unitIndex];
    $('lensWord').textContent = u.word;
    $('lensCount').textContent = (unitIndex + 1) + ' / ' + units.length;
    renderChips(units, unitIndex);
    $('lensPhrase').textContent = String(input.value || '').trim();
    $('lensMeaning').textContent = glossFor(input.value);
    $('lensGloss').querySelector('.sep').hidden = !glossFor(input.value);
    $('lensSyl').textContent = u.tok.text;
    $('lensNote').innerHTML = noteHtml(u.tok);
    var lay = Sulat.layout(pack, [{ text: u.tok.text, tokens: [u.tok] }], { pad: 90 });
    var lensInk = Math.max(26, Math.min(60, lay.viewBox[2] / 80));
    ctrl = Sulat.render($('lensStage'), pack, lay, {
      labels: false,
      ink: lensInk,
      dotInk: lensInk * 1.3,
      ariaLabel: u.tok.text + ' in Baybayin'
    });
    ctrl.play({ speed: speed });
    playPhraseOnce(input.value);
    setLensUI();
  }

  function replay() { if (ctrl) { ctrl.play({ speed: speed }); } playPhrase(input.value); }

  // Built with Muse Code: the Replay button follows the lens mode, so Enter
  // (or Neural Band Select) always presses the focused button for this screen.
  var LEGEND = {
    show: { up: 'Phrases', down: 'Write it', left: 'Prev', right: 'Next' },
    try: { up: 'Show me', down: '', left: 'Watch again', right: 'Next' },
    checking: { up: '', down: '', left: 'Back', right: '' },
    verdict: { up: '', down: '', left: 'Watch again', right: 'Next' }
  };
  function setKey(id, label) {
    var k = $(id);
    k.classList.toggle('off', !label);
    k.querySelector('.lbl').textContent = label || '';
  }
  var KEY_IDS = { ArrowUp: 'keyUp', ArrowDown: 'keyDown', ArrowLeft: 'keyLeft', ArrowRight: 'keyRight', Enter: 'lensReplay', ' ': 'lensReplay' };
  function flashKey(k) {
    var el = KEY_IDS[k] ? $(KEY_IDS[k]) : null;
    if (!el) { return; }
    el.classList.add('pressed');
    clearTimeout(el.__flash);
    el.__flash = setTimeout(function () { el.classList.remove('pressed'); }, 320);
  }
  function setLensUI() {
    var b = $('lensReplay');
    var lab = $('lensReplayLabel');
    $('lens').setAttribute('data-mode', lensMode);
    if (lensMode === 'checking') { lab.textContent = 'Checking…'; b.disabled = true; }
    else {
      b.disabled = false;
      lab.textContent = lensMode === 'try' ? 'Check' : (lensMode === 'verdict' ? 'Check again' : 'Replay');
    }
    var L = LEGEND[lensMode] || LEGEND.show;
    setKey('keyUp', L.up); setKey('keyDown', L.down); setKey('keyLeft', L.left); setKey('keyRight', L.right);
    b.focus();
  }

  function escLensTip(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Verdicts may pair praise with a fix ("Lovely ki!", "Dot sits left.").
  // Show the fix first so the learner sees what to change.
  var LENS_PRAISE = /\b(lovely|great|nice|perfect|beautiful|wonderful|excellent|good job|well done)\b|!\s*$/i;
  function orderTips(tips) {
    var fix = [], kind = [];
    (tips || []).filter(function (t) { return typeof t === 'string' && t.trim(); }).slice(0, 2).forEach(function (t) {
      ((LENS_PRAISE.test(t)) ? kind : fix).push(t);
    });
    return fix.concat(kind);
  }

  // "Now you try" for the current syllable: the learner writes on paper under
  // the desk camera and presses to check. Enter posts a capture command; the
  // phone answers in the room and the lenses poll for it.
  function currentTok() {
    words = Sulat.syllabify(input.value);
    var units = lensUnits();
    if (!units.length) { return null; }
    unitIndex = (unitIndex + units.length) % units.length;
    return units[unitIndex].tok.text;
  }

  function openTry() {
    if (!pack) { return; }
    var text = currentTok();
    if (!text) { return; }
    clearTimeout(lensTimer);
    if (ctrl) { try { ctrl.stop(); } catch (e) { /* already stopped */ } }
    tryTok = text;
    lensMode = 'try';
    $('lensStage').innerHTML = '';
    $('lensWord').textContent = 'Write ' + text + ' on paper';
    $('lensCount').textContent = 'Phone code: ' + roomCode;
    $('lensNote').textContent = 'Press to check';
    setLensUI();
  }

  function postCapture(text) {
    lensMode = 'checking';
    clearTimeout(lensTimer);
    $('lensWord').textContent = 'Checking…';
    $('lensNote').textContent = '';
    setLensUI();
    fetch('/api/room', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: roomCode, action: 'capture', target: text })
    }).then(function (res) {
      return res.ok ? res.json() : Promise.reject(new Error('room ' + res.status));
    }).then(function (data) {
      if (!data || !data.command) { throw new Error('no command'); }
      pendingCmd = data.command;
      tryTok = data.command.target || text;
      pollLens(90);
    }).catch(function () {
      lensMode = 'try';
      $('lensWord').textContent = 'Write ' + tryTok + ' on paper';
      $('lensNote').textContent = 'Room unreachable. Enter to try again.';
      setLensUI();
    });
  }

  function pollLens(left) {
    clearTimeout(lensTimer);
    if (!pendingCmd) { return; }
    if (left <= 0) {
      lensMode = 'try';
      $('lensNote').textContent = 'No answer from the phone. Is desk camera on?';
      setLensUI();
      return;
    }
    var want = pendingCmd ? pendingCmd.id : null;
    lensTimer = setTimeout(function () {
      fetch('/api/room?code=' + encodeURIComponent(roomCode), { cache: 'no-store' }).then(function (res) {
        return res.ok ? res.json() : null;
      }).then(function (room) {
        if (lensMode !== 'checking' || !pendingCmd || pendingCmd.id !== want) { return; }
        if (room && room.result && room.result.id === want) { showVerdict(room.result); }
        else { pollLens(left - 1); }
      }).catch(function () { if (lensMode === 'checking') { pollLens(left - 1); } });
    }, 1000);
  }

  function showVerdict(found) {
    if (lensMode !== 'checking') { return; }
    clearTimeout(lensTimer);
    lensMode = 'verdict';
    $('lensWord').textContent = found.verdict === 'good' ? 'Magaling!'
      : (found.verdict === 'almost' ? 'Almost' : 'Try again');
    var shown = found.verdict === 'good'
      ? orderTips(found.tips).slice(0, 1)
      : orderTips(found.tips);
    $('lensNote').innerHTML = shown.map(escLensTip).join('<br>');
    if (found.verdict === 'good') { playAudio('magaling'); }
    setLensUI();
  }

  function go(url) {
    if (window.__sulatNav) { window.__sulatNav(url); } else { window.location.replace(url); }
  }

  STARTERS.forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '';
    b.appendChild(document.createTextNode(s.text));
    var sm = document.createElement('small');
    sm.textContent = s.en;
    b.appendChild(sm);
    b.addEventListener('click', function () { input.value = s.text; renderPhrase(); });
    $('starters').appendChild(b);
  });

  $('go').addEventListener('click', renderPhrase);
  $('replay').addEventListener('click', replay);
  $('lensReplay').addEventListener('click', function () {
    if (lensMode === 'show') { replay(); }
    else if (lensMode === 'checking') { /* ignore while checking */ }
    else {
      var text = currentTok() || tryTok;
      if (text) { postCapture(text); }
    }
  });
  $('slow').addEventListener('click', function () {
    speed = speed < 1 ? 1 : 0.55;
    $('slow').setAttribute('aria-pressed', speed < 1 ? 'true' : 'false');
    updateLensLink();
    replay();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); renderPhrase(); }
  });
  input.addEventListener('input', updateLensLink);

  // The Neural Band arrives as arrow keys and Enter.
  document.addEventListener('keydown', function (e) {
    if (e.target === input) { return; }
    if (glasses) { flashKey(e.key); }
    if (glasses) {
      if (e.key === 'ArrowRight') { e.preventDefault(); unitIndex += 1; renderLensUnit(); }
      else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (lensMode === 'show') { unitIndex -= 1; }
        renderLensUnit();
      }
      else if (e.key === 'ArrowDown') { e.preventDefault(); openTry(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (lensMode === 'show') { go('index.html'); } else { renderLensUnit(); } }
      else if ((e.key === 'Enter' || e.key === ' ') && e.target !== $('lensReplay')) {
        e.preventDefault();
        if (lensMode === 'show') { replay(); }
        else if (lensMode === 'checking') { /* ignore while checking */ }
        else {
          var text = currentTok() || tryTok;
          if (text) { postCapture(text); }
        }
      }
    } else if (e.key === 'Enter' && e.target === document.body) {
      e.preventDefault();
      replay();
    }
  });

  Sulat.loadPack('packs/baybayin.json').then(function (p) {
    pack = p;
    if (glasses) { renderLensUnit(); } else { renderPhrase(); }
  }).catch(function (err) {
    var msg = 'Couldn’t load packs/baybayin.json. Open this page from your Sulat site, not as a local file. (' + err.message + ')';
    if (glasses) { $('lensWord').textContent = msg; } else { status(msg); }
  });
})();
</script>
</body>
</html>
