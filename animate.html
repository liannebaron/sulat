<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sulat · Show me</title>
<script>
  // Runs before anything is drawn, so the glasses never flash the light page layout.
  if (/[?&]view=glasses(&|$)/.test(window.location.search)) { document.documentElement.className += ' glasses'; }
</script>
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="phone.css">
<style>
  /* Phone Show me: cream paper, leaf green, Marina's note. Shared look lives in phone.css. */
  .page.wrap { gap: 12px; }
  .marina img { width: 84px; }
  .bubble .hi { font-size: 28px; }
  .bubble .say { white-space: nowrap; font-size: 15px; }
  .starters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .starters button { min-height: 44px; padding: 0 16px; border: 1.5px solid var(--tan); border-radius: 999px; background: var(--cream); color: var(--ink); font: 600 15px Figtree, sans-serif; white-space: nowrap; box-shadow: 0 3px 0 var(--tan); cursor: pointer; touch-action: manipulation; }
  .starters button small { display: none; }
  .starters button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--cream); box-shadow: 0 3px 0 var(--leaf-dark); }
  .typeit { display: flex; gap: 8px; }
  .typeit input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; font: 500 17px Figtree, sans-serif; color: var(--ink); background: #FFFFFF; border: 1.5px solid var(--tan); border-radius: 12px; }
  .typeit button, .smallbtn { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--leaf); background: #FFFFFF; color: var(--leaf); font: 700 15px Figtree, sans-serif; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
  .typeit button.go { background: var(--leaf); color: var(--cream); box-shadow: 0 3px 0 var(--leaf-dark); }
  .smallbtn { display: inline-flex; align-items: center; gap: 6px; }
  .smallbtn[aria-pressed="true"] { background: var(--sage); border-color: var(--leaf); }
  .panel { padding: 14px 16px; background-color: var(--cream); border: 1.5px solid var(--tan); border-radius: 18px; box-shadow: 0 3px 0 var(--tan), 0 12px 20px -14px rgba(91,70,30,0.45); }
  #phraseTitle { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  #phraseTitle span { font-weight: 500; color: var(--muted); }
  #stage svg { display: block; width: 100%; height: auto; max-height: 320px; color: var(--ink); }
  #stage .label { fill: var(--muted); font-family: Figtree, system-ui, sans-serif; font-weight: 600; }
  #stage .label.active { fill: var(--leaf); font-weight: 700; }
  .controls { display: flex; gap: 8px; margin-top: 10px; }
  #syllables { position: absolute; left: -9999px; }
  .panel h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  #breakdown { margin: 0; padding: 0; list-style: none; color: var(--quiet); font-size: clamp(12px, 3.45vw, 14px); line-height: 1.5; }
  #breakdown li { margin: 2px 0; }
  #breakdown li b { color: var(--ink); font-weight: 700; }
  #status { min-height: 1.4em; color: var(--muted); margin: 0; font-size: 14px; }
  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }

  /* Glasses view: 600x600, black is see-through on the Display. Lines, not fills.
     Fonts are local files so Show me never needs the network beyond the pack. */
  @font-face { font-family: 'Figtree'; src: url('fonts/figtree.woff2') format('woff2'); font-weight: 300 900; font-display: swap; }
  @font-face { font-family: 'Caveat'; src: url('fonts/caveat.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
  html.glasses, html.glasses body { background: #000; color: #F5ECD7; }
  html.glasses .wrap { display: none; }
  #lens { display: none; }
  html.glasses #lens {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    box-sizing: border-box;
    width: min(100vw, 600px);
    height: min(100vh, 600px);
    margin: 0 auto;
    padding: 22px 30px;
    font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #F5ECD7;
  }
  #lensTop { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
  #lensLogo { height: 40px; width: auto; display: block; opacity: 0.92; }
  #lensGloss { font-size: 20px; white-space: nowrap; }
  #lensPhrase { color: #FFFFFF; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  #lensGloss .sep { margin: 0 10px; color: rgba(245,236,215,0.45); }
  #lensMeaning { color: rgba(245,236,215,0.75); }
  #lensChips { display: flex; justify-content: center; align-items: center; gap: 6px; }
  .chip {
    height: 38px; min-width: 38px; padding: 0 8px; box-sizing: border-box; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600;
    border: 2px solid rgba(245,236,215,0.4); color: rgba(245,236,215,0.4);
  }
  .chip.done { border-color: #C5E3A1; color: #C5E3A1; }
  .chip.cur { border: 3px solid #F5ECD7; border-bottom: 6px solid #FF8E72; color: #F5ECD7; font-weight: 700; }
  .chipGap { width: 8px; flex: none; }
  #lensWord { font-size: 30px; font-weight: 600; text-wrap: balance; }
  #lensCount { font-size: 24px; }
  #lensStage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #lensStage svg { display: block; width: 100%; height: 100%; max-height: 280px; color: #F5ECD7; }
  #lensStage .mark { color: #FF8E72; }
  #lensLabel { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  #lensSyl { font-size: 44px; font-weight: 700; line-height: 1; color: #FFFFFF; }
  #lensNote { font-size: 22px; line-height: 1.3; color: rgba(245,236,215,0.88); min-height: 1.3em; }
  #lensNote .hl { color: #FF8E72; font-weight: 600; }
  #lensBottom { display: flex; justify-content: center; align-items: flex-start; gap: 14px; }
  .key, #lensReplay { min-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .key .cap, #lensReplay .cap {
    width: 64px; height: 40px; box-sizing: border-box; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #F5ECD7; border: 2px solid rgba(245,236,215,0.5);
    transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
  }
  #lensReplay .cap { font-size: 17px; font-weight: 700; }
  .key .lbl, #lensReplay .lbl { font-size: 18px; color: rgba(245,236,215,0.8); white-space: nowrap; transition: color 0.15s; }
  .key.off { display: none; }
  /* The one real button: Enter (or Neural Band Select) always presses it. */
  #lensReplay { background: transparent; border: 0; padding: 0; margin: 0; font: inherit; cursor: pointer; }
  #lensReplay:focus, #lensReplay:focus-visible { outline: none; }
  #lensReplay:disabled { opacity: 0.55; cursor: default; }
  /* Gold flashes on the key you just pressed. */
  .key.pressed .cap, #lensReplay.pressed .cap { border-color: #F6C85C; color: #F6C85C; box-shadow: 0 0 0 3px rgba(246,200,92,0.28); }
  .key.pressed .lbl, #lensReplay.pressed .lbl { color: #F6C85C; }
  /* Try screen: write it on paper, pair the phone, press Enter. */
  #lensWord .tok { color: #FF8E72; }
  #lens[data-mode="try"] #lensWord { text-align: center; }
  #lensPair { display: none; align-items: flex-end; gap: 12px; }
  #lensPair img { width: 104px; height: auto; display: block; flex: none; }
  #lensPair p { margin: 0 0 12px; flex: 1; padding: 12px 16px; border: 2px solid #C5E3A1; border-radius: 20px 20px 20px 4px; font-size: 21px; line-height: 1.3; }
  #lensPair p span { display: block; white-space: nowrap; }
  #lensCode { display: none; justify-content: center; gap: 10px; }
  .digit { width: 84px; height: 96px; box-sizing: border-box; border: 3px solid #F5ECD7; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 700; color: #FFFFFF; }
  #lensCode.long .digit { width: 58px; height: 80px; font-size: 44px; }
  #lens[data-mode="try"] #lensPair, #lens[data-mode="try"] #lensCode { display: flex; }
  #lens[data-mode="try"] #lensCount, #lens[data-mode="try"] #lensStage { display: none; }
  /* Checking: Marina reads your page while the sampaguita breathes. */
  #lensWait { display: none; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  #lens[data-mode="checking"] #lensWait { display: flex; }
  #lens[data-mode="checking"] #lensWord, #lens[data-mode="checking"] #lensCount,
  #lens[data-mode="checking"] #lensStage, #lens[data-mode="checking"] #lensLabel { display: none; }
  .bloom { position: relative; width: 200px; height: 200px; }
  .bloom img { position: absolute; left: 25px; top: 32px; width: 150px; height: auto; display: block; animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 55%; }
  .bloom svg { position: absolute; left: 0; top: 0; width: 200px; height: 200px; animation: orbit 9s linear infinite; transform-origin: 100px 100px; }
  @keyframes breathe { 0%, 100% { transform: scale(0.94); opacity: 0.82; } 50% { transform: scale(1.03); opacity: 1; } }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .bloom img, .bloom svg { animation: none; } }
  #waitHead { font-family: Caveat, Figtree, cursive; font-size: 46px; font-weight: 700; line-height: 1; color: #F5ECD7; }
  #waitStep { font-size: 22px; color: rgba(245,236,215,0.88); min-height: 1.3em; }
  #waitHint { font-size: 18px; color: rgba(245,236,215,0.6); }
  /* Verdict: Marina answers. Green = right, gold = almost, red = try again. */
  #lensVerdict { display: none; align-items: center; gap: 18px; }
  #lens[data-mode="verdict"] #lensVerdict { display: flex; }
  #lens[data-mode="verdict"] #lensWord, #lens[data-mode="verdict"] #lensCount,
  #lens[data-mode="verdict"] #lensStage, #lens[data-mode="verdict"] #lensLabel { display: none; }
  #lensVerdict > img { width: 170px; height: auto; display: block; flex: none; }
  .vcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .vheadwrap { position: relative; }
  #vHead { font-family: Caveat, Figtree, cursive; font-size: 84px; font-weight: 700; line-height: 0.9; display: inline-block; white-space: nowrap; }
  #vHead.good { color: #C5E3A1; }
  #vHead.almost { color: #F6C85C; }
  #vHead.retry { color: #FF8E72; }
  #vHead.pop { animation: pop 0.7s cubic-bezier(.2,.9,.3,1.2) both; transform-origin: left center; }
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  #vTips { font-size: 22px; line-height: 1.35; color: rgba(245,236,215,0.9); }
  /* A sampaguita opens over the word and sprays gold pollen (right answers only). */
  #vBurst { position: absolute; right: 52px; top: -6px; width: 0; height: 0; display: none; pointer-events: none; }
  #vBurst.on { display: block; }
  #vBurst img { position: absolute; left: -30px; top: -26px; width: 60px; height: auto; animation: bloomin 3.4s ease-out infinite; transform-origin: 50% 50%; }
  #vBurst .spray { position: absolute; left: 0; top: 0; width: var(--d, 6px); height: var(--d, 6px); margin: calc(var(--d, 6px) / -2) 0 0 calc(var(--d, 6px) / -2); border-radius: 50%; background: #F6C85C; box-shadow: 0 0 6px rgba(246,200,92,0.7); opacity: 0; animation: spray 3.4s cubic-bezier(.12,.75,.3,1) infinite; }
  #vBurst .spray.petal { width: 13px; height: 6px; margin: -3px 0 0 -6px; border-radius: 6px / 5px; background: #F5ECD7; box-shadow: none; rotate: var(--r); }
  @keyframes spray { 0% { transform: translate(0, 0) scale(0.3); opacity: 0; } 8% { opacity: 1; } 55% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }
  @keyframes bloomin { 0% { transform: scale(0) rotate(-70deg); opacity: 0; } 28% { transform: scale(1.12) rotate(5deg); opacity: 1; } 38% { transform: scale(1) rotate(24deg); } 72% { transform: scale(1) rotate(80deg); opacity: 1; } 100% { transform: scale(1) rotate(115deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #vHead.pop, #vBurst img, #vBurst .spray { animation: none; } #vBurst .spray { opacity: 0; } }
  /* Each mode shows only what it needs. */
  #lens[data-mode="show"] #lensWord, #lens[data-mode="show"] #lensCount { display: none; }
  #lens:not([data-mode="show"]) #lensSyl { display: none; }
</style>
</head>
<body>
<div class="page wrap">
  <div class="bar">
    <a href="index.html?view=phone" aria-label="Sulat home"><img src="img/wordmark-green.png" alt="Sulat"></a>
    <button type="button" class="iconbtn" id="sound" aria-pressed="false" aria-label="Sound on. Tap to turn off"><svg class="on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg><svg class="off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9l5 6M22 9l-5 6"></path></svg></button>
  </div>

  <div class="marina">
    <img src="img/marina.webp" alt="Marina">
    <div class="bubble">
      <p class="hi">Watch it written!</p>
      <p class="say">Tap a phrase, or type one.</p>
    </div>
  </div>

  <div class="starters" id="starters"></div>

  <div class="typeit">
    <label for="phrase" style="position:absolute;left:-9999px">Phrase</label>
    <input id="phrase" type="text" value="mahal kita" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="go" type="button" class="go">Show me</button>
  </div>

  <div class="panel bamboo">
    <div id="phraseTitle"></div>
    <div id="stage" aria-live="polite"></div>
    <p id="syllables"></p>
    <div class="controls">
      <button id="replay" type="button" class="smallbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>Replay</button>
      <button id="slow" type="button" class="smallbtn" aria-pressed="false">Slow</button>
    </div>
  </div>

  <div class="panel">
    <h2>Letter by letter</h2>
    <ul id="breakdown"></ul>
  </div>

  <p id="status" role="status"></p>

  <div class="actions">
    <a id="practiceLink" class="btn" href="practice.html">Practice this</a>
  </div>
</div>

<div id="lens" aria-live="polite" data-mode="show">
  <div id="lensTop">
    <img id="lensLogo" src="img/wordmark-cream.png" alt="Sulat">
    <span id="lensGloss"><span id="lensPhrase"></span><span class="sep">|</span><span id="lensMeaning"></span></span>
  </div>
  <div id="lensChips" aria-label="Progress through the phrase"></div>
  <div id="lensWord"></div>
  <div id="lensCount"></div>
  <div id="lensPair">
    <img src="img/marina-lens.webp" alt="Marina">
    <p><span>Type this code on your phone.</span><span>When the camera is on,</span><span>press Enter to take a photo.</span></p>
  </div>
  <div id="lensCode" aria-label="Phone code"></div>
  <div id="lensWait" role="status">
    <div class="bloom" aria-hidden="true">
      <img src="img/sampaguita-lens.webp" alt="">
      <svg viewBox="0 0 200 200"><circle cx="100" cy="7" r="5" fill="#F6C85C"></circle><circle cx="178" cy="68" r="4" fill="#F6C85C" fill-opacity="0.75"></circle><circle cx="148" cy="181" r="3" fill="#F6C85C" fill-opacity="0.55"></circle><circle cx="46" cy="179" r="2.5" fill="#F6C85C" fill-opacity="0.4"></circle><circle cx="10" cy="74" r="2" fill="#F6C85C" fill-opacity="0.3"></circle></svg>
    </div>
    <div id="waitHead"></div>
    <div id="waitStep"></div>
    <div id="waitHint">Keep the paper still. Usually under a minute.</div>
  </div>
  <div id="lensVerdict" role="status">
    <img src="img/marina-lens.webp" alt="Marina">
    <div class="vcol">
      <div class="vheadwrap"><span id="vHead"></span><div id="vBurst" aria-hidden="true"><img src="img/sampaguita-lens.webp" alt=""><span class="spray petal" style="--dx:55px;--dy:10px;--r:-3deg;animation-delay:0.69s"></span><span class="spray" style="--dx:73px;--dy:24px;--d:4px;animation-delay:0.65s"></span><span class="spray" style="--dx:44px;--dy:52px;--d:7px;animation-delay:0.61s"></span><span class="spray" style="--dx:40px;--dy:48px;--d:9px;animation-delay:0.66s"></span><span class="spray" style="--dx:31px;--dy:64px;--d:4px;animation-delay:0.69s"></span><span class="spray" style="--dx:8px;--dy:81px;--d:4px;animation-delay:0.74s"></span><span class="spray petal" style="--dx:-9px;--dy:68px;--r:99deg;animation-delay:0.66s"></span><span class="spray" style="--dx:-32px;--dy:82px;--d:5px;animation-delay:0.68s"></span><span class="spray" style="--dx:-41px;--dy:77px;--d:4px;animation-delay:0.63s"></span><span class="spray" style="--dx:-43px;--dy:41px;--d:5px;animation-delay:0.61s"></span><span class="spray" style="--dx:-71px;--dy:35px;--d:7px;animation-delay:0.71s"></span><span class="spray" style="--dx:-70px;--dy:12px;--d:5px;animation-delay:0.64s"></span><span class="spray petal" style="--dx:-56px;--dy:-7px;--r:200deg;animation-delay:0.68s"></span><span class="spray" style="--dx:-75px;--dy:-35px;--d:6px;animation-delay:0.70s"></span><span class="spray" style="--dx:-32px;--dy:-26px;--d:5px;animation-delay:0.67s"></span><span class="spray" style="--dx:-18px;--dy:-38px;--d:4px;animation-delay:0.67s"></span><span class="spray" style="--dx:1px;--dy:-38px;--d:6px;animation-delay:0.68s"></span><span class="spray" style="--dx:6px;--dy:-51px;--d:7px;animation-delay:0.67s"></span><span class="spray petal" style="--dx:14px;--dy:-37px;--r:285deg;animation-delay:0.64s"></span><span class="spray" style="--dx:36px;--dy:-22px;--d:6px;animation-delay:0.70s"></span><span class="spray" style="--dx:83px;--dy:-33px;--d:6px;animation-delay:0.72s"></span><span class="spray" style="--dx:89px;--dy:-5px;--d:7px;animation-delay:0.65s"></span></div></div>
      <div id="vTips"></div>
    </div>
  </div>
  <div id="lensStage"></div>
  <div id="lensLabel"><span id="lensSyl"></span><div id="lensNote"></div></div>
  <div id="lensBottom">
    <div class="key" id="keyUp"><span class="cap">&#8593;</span><span class="lbl">Phrases</span></div>
    <div class="key" id="keyDown"><span class="cap">&#8595;</span><span class="lbl">Write it</span></div>
    <div class="key" id="keyLeft"><span class="cap">&#8592;</span><span class="lbl">Prev</span></div>
    <button id="lensReplay" type="button"><span class="cap">Enter</span><span class="lbl" id="lensReplayLabel">Replay</span></button>
    <div class="key" id="keyRight"><span class="cap">&#8594;</span><span class="lbl">Next</span></div>
  </div>
  <div id="lensHint" hidden></div>
</div>

<script src="sulat-engine.js"></script>
<script>
(function () {
  'use strict';

  var STARTERS = [
    { text: 'mahal kita', en: 'I love you' },
    { text: 'salamat', en: 'thank you' },
    { text: 'kumusta', en: 'how are you' },
    { text: 'magandang umaga', en: 'good morning' },
    { text: 'paalam', en: 'goodbye' }
  ];

  // Built with Muse Code: Tagalog voice clips recorded by my mother.
  // Sound never blocks the lesson: a failed play is silently ignored.
  var AUDIO_PHRASES = { 'mahal kita': 1, salamat: 1, kumusta: 1, 'magandang umaga': 1, paalam: 1 };
  function playAudio(name) {
    try { if (window.localStorage.getItem('sulat.sound') === 'off') { return; } } catch (e) { /* storage unavailable: sound stays on */ }
    try {
      var p = new Audio('audio/' + name + '.mp3').play();
      if (p && p.catch) { p.catch(function () { /* no sound: keep going */ }); }
    } catch (e) { /* audio unsupported: keep going */ }
  }
  function playPhrase(text) {
    var key = String(text || '').toLowerCase().trim().replace(/\s+/g, ' ');
    if (AUDIO_PHRASES[key]) { playAudio(key.replace(/ /g, '-')); }
  }
  var lastPhraseAudio = '';
  function playPhraseOnce(text) {
    var key = String(text || '').toLowerCase().trim().replace(/\s+/g, ' ');
    if (key && key !== lastPhraseAudio) { lastPhraseAudio = key; playPhrase(key); }
  }

  var params = new URLSearchParams(window.location.search);
  var glasses = params.get('view') === 'glasses';
  document.documentElement.classList.toggle('glasses', glasses);

  var $ = function (id) { return document.getElementById(id); };
  var input = $('phrase');
  if (params.get('text')) { input.value = params.get('text'); }

  var pack = null;
  var ctrl = null;
  var words = [];
  var unitIndex = 0;
  var speed = params.get('speed') === 'slow' ? 0.55 : (glasses ? 0.7 : 1);
  $('slow').setAttribute('aria-pressed', speed < 1 ? 'true' : 'false');

  function status(msg) { $('status').textContent = msg; }

  // Built with Muse Code: glasses loop. The lenses never touch the network for
  // anything but this room: they post a capture command, the desk phone answers.
  var lensMode = 'show'; // show | try | checking | verdict
  var lensTimer = 0;
  var pendingCmd = null;
  var tryTok = '';
  var roomCode = null;
  if (glasses) {
    var qroom = params.get('room');
    if (qroom && /^[A-Za-z0-9]{4,8}$/.test(qroom)) {
      roomCode = qroom.toUpperCase();
      try { window.localStorage.setItem('sulat.room', roomCode); } catch (e) { /* private mode */ }
    } else {
      try { roomCode = window.localStorage.getItem('sulat.room'); } catch (e) { roomCode = null; }
      if (roomCode) { roomCode = String(roomCode).toUpperCase(); }
      if (!roomCode || !/^[A-Z0-9]{4,8}$/.test(roomCode)) { roomCode = null; }
    }
    if (!roomCode) {
      roomCode = String(Math.floor(1000 + Math.random() * 9000));
      try { window.localStorage.setItem('sulat.room', roomCode); } catch (e) { /* private mode */ }
    }
  }

  function highlighter(labels) {
    return function (i) {
      labels().forEach(function (n, k) { n.classList.toggle('active', k === i); });
    };
  }

  function markStarters() {
    var key = String(input.value || '').toLowerCase().trim().replace(/\s+/g, ' ');
    Array.prototype.forEach.call($('starters').children, function (b) {
      b.setAttribute('aria-pressed', b.firstChild && b.firstChild.nodeValue === key ? 'true' : 'false');
    });
  }
  function updateLensLink() {
    var pl = $('practiceLink');
    if (pl) { pl.href = 'practice.html?text=' + encodeURIComponent(input.value); }
    markStarters();
    var q = new URLSearchParams({ view: 'glasses', text: input.value });
    if (speed < 1) { q.set('speed', 'slow'); }
    var ll = $('lensLink');
    if (ll) { ll.href = '?' + q.toString(); }
  }

  function renderPhrase() {
    if (!pack) { return; }
    words = Sulat.syllabify(input.value);
    updateLensLink();
    var g = glossFor(input.value);
    $('phraseTitle').innerHTML = escLensTip(String(input.value).trim()) + (g ? ' <span>· ' + escLensTip(g) + '</span>' : '');
    if (!words.length) { $('stage').innerHTML = ''; $('syllables').textContent = ''; $('breakdown').innerHTML = ''; return; }
    var lay = Sulat.layout(pack, words);
    var c = null;
    var stageW = $('stage').clientWidth || 318;
    c = Sulat.render($('stage'), pack, lay, {
      labels: true,
      labelSize: Math.max(70, 15 * lay.viewBox[2] / stageW),
      ariaLabel: input.value + ' in Baybayin',
      onGlyph: highlighter(function () { return c ? c.labels : []; })
    });
    ctrl = c;

    $('syllables').textContent = words.map(function (w) {
      return w.tokens.map(function (t) { return t.text; }).join(' · ');
    }).join('   ');
    var list = $('breakdown');
    list.innerHTML = '';
    words.forEach(function (w) {
      w.tokens.forEach(function (t) {
        var li = document.createElement('li');
        var d = Sulat.describe(t), k = d.indexOf(':');
        var bold = document.createElement('b');
        bold.textContent = k > 0 ? d.slice(0, k) : d;
        li.appendChild(bold);
        if (k > 0) { li.appendChild(document.createTextNode(d.slice(k))); }
        list.appendChild(li);
      });
    });
    status(lay.missing.length ? 'Missing from the stroke pack: ' + lay.missing.join(', ') : '');
    ctrl.play({ speed: speed });
    playPhrase(input.value);
  }

  // On the glasses each syllable gets its own screen, so it stays large and learners can follow.
  function lensUnits() {
    var out = [];
    words.forEach(function (w, wi) {
      w.tokens.forEach(function (t) { out.push({ word: w.text, wi: wi, tok: t }); });
    });
    return out;
  }

  // Glasses header: the phrase's meaning, the syllable chips, and a plain note that highlights the mark.
  function glossFor(text) {
    var key = String(text || '').toLowerCase().trim().replace(/\s+/g, ' ');
    for (var k = 0; k < STARTERS.length; k++) { if (STARTERS[k].text === key) { return STARTERS[k].en; } }
    return '';
  }
  function renderChips(units, idx) {
    var box = $('lensChips');
    box.innerHTML = '';
    units.forEach(function (un, k) {
      if (k > 0 && un.wi !== units[k - 1].wi) {
        var gap = document.createElement('span');
        gap.className = 'chipGap';
        box.appendChild(gap);
      }
      var c = document.createElement('span');
      c.className = 'chip' + (k < idx ? ' done' : (k === idx ? ' cur' : ''));
      c.textContent = un.tok.text;
      box.appendChild(c);
    });
  }
  function noteHtml(tok) {
    var t = Sulat.describe(tok).replace(/^[^:]*:\s*/, '');
    return escLensTip(t).replace(/(dot above|dot below|cross below)/, '<span class="hl">$1</span>');
  }

  function renderLensUnit() {
    if (!pack) { return; }
    words = Sulat.syllabify(input.value);
    var units = lensUnits();
    if (!units.length) { return; }
    unitIndex = (unitIndex + units.length) % units.length;
    lensMode = 'show';
    clearTimeout(lensTimer);
    var u = units[unitIndex];
    $('lensWord').textContent = u.word;
    $('lensCount').textContent = (unitIndex + 1) + ' / ' + units.length;
    renderChips(units, unitIndex);
    $('lensPhrase').textContent = String(input.value || '').trim();
    $('lensMeaning').textContent = glossFor(input.value);
    $('lensGloss').querySelector('.sep').hidden = !glossFor(input.value);
    $('lensSyl').textContent = u.tok.text;
    $('lensNote').innerHTML = noteHtml(u.tok);
    var lay = Sulat.layout(pack, [{ text: u.tok.text, tokens: [u.tok] }], { pad: 90 });
    var lensInk = Math.max(26, Math.min(60, lay.viewBox[2] / 80));
    ctrl = Sulat.render($('lensStage'), pack, lay, {
      labels: false,
      ink: lensInk,
      dotInk: lensInk * 1.3,
      ariaLabel: u.tok.text + ' in Baybayin'
    });
    ctrl.play({ speed: speed });
    playPhraseOnce(input.value);
    setLensUI();
  }

  function replay() { if (ctrl) { ctrl.play({ speed: speed }); } playPhrase(input.value); }

  // Built with Muse Code: the Replay button follows the lens mode, so Enter
  // (or Neural Band Select) always presses the focused button for this screen.
  var LEGEND = {
    show: { up: 'Phrases', down: 'Write it', left: 'Prev', right: 'Next' },
    try: { up: 'Show me', down: '', left: 'Watch again', right: 'Next' },
    checking: { up: '', down: '', left: 'Back', right: '' },
    verdict: { up: '', down: '', left: 'Watch again', right: 'Next' }
  };
  function setKey(id, label) {
    var k = $(id);
    k.classList.toggle('off', !label);
    k.querySelector('.lbl').textContent = label || '';
  }
  var KEY_IDS = { ArrowUp: 'keyUp', ArrowDown: 'keyDown', ArrowLeft: 'keyLeft', ArrowRight: 'keyRight', Enter: 'lensReplay', ' ': 'lensReplay' };
  function flashKey(k) {
    var el = KEY_IDS[k] ? $(KEY_IDS[k]) : null;
    if (!el) { return; }
    el.classList.add('pressed');
    clearTimeout(el.__flash);
    el.__flash = setTimeout(function () { el.classList.remove('pressed'); }, 320);
  }
  var waitTimers = [];
  function stopWaitSteps() { waitTimers.forEach(clearTimeout); waitTimers = []; }
  function startWaitSteps(tok) {
    stopWaitSteps();
    $('waitHead').textContent = 'Marina is reading your ' + tok;
    var steps = [[0, 'Lifting your page…'], [6000, 'Reading your strokes…'], [14000, 'Comparing it with ' + tok + '…'], [28000, 'Almost there…']];
    steps.forEach(function (st) {
      waitTimers.push(setTimeout(function () { if (lensMode === 'checking') { $('waitStep').textContent = st[1]; } }, st[0]));
    });
  }
  var lastVerdict = null;
  function nextLabel() {
    var units = lensUnits();
    if (!units.length) { return 'Next glyph'; }
    var nx = units[unitIndex + 1];
    return nx ? 'Next: ' + nx.tok.text : 'Finish';
  }
  // Enter always presses the lens button; this is what the button does in each mode.
  function lensPrimary() {
    if (lensMode === 'show') { replay(); return; }
    if (lensMode === 'checking') { return; } // ignore while checking
    if (lensMode === 'verdict' && lastVerdict === 'good') {
      var units = lensUnits();
      if (unitIndex + 1 >= units.length) { go('glasses.html'); return; }
      unitIndex += 1;
      renderLensUnit();
      return;
    }
    var text = currentTok() || tryTok;
    if (text) { postCapture(text); }
  }
  function setLensUI() {
    var b = $('lensReplay');
    var lab = $('lensReplayLabel');
    $('lens').setAttribute('data-mode', lensMode);
    if (lensMode === 'checking') { startWaitSteps(tryTok); } else { stopWaitSteps(); }
    if (lensMode === 'checking') { lab.textContent = 'Checking…'; b.disabled = true; }
    else {
      b.disabled = false;
      lab.textContent = lensMode === 'try' ? 'Check my work'
        : (lensMode === 'verdict' ? (lastVerdict === 'good' ? nextLabel() : 'Check again') : 'Replay');
    }
    var L = LEGEND[lensMode] || LEGEND.show;
    setKey('keyUp', L.up); setKey('keyDown', L.down); setKey('keyLeft', L.left); setKey('keyRight', L.right);
    b.focus();
  }

  function escLensTip(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Verdicts may pair praise with a fix ("Lovely ki!", "Dot sits left.").
  // Show the fix first so the learner sees what to change.
  var LENS_PRAISE = /\b(lovely|great|nice|perfect|beautiful|wonderful|excellent|good job|well done)\b|!\s*$/i;
  function orderTips(tips) {
    var fix = [], kind = [];
    (tips || []).filter(function (t) { return typeof t === 'string' && t.trim(); }).slice(0, 2).forEach(function (t) {
      ((LENS_PRAISE.test(t)) ? kind : fix).push(t);
    });
    return fix.concat(kind);
  }

  // "Now you try" for the current syllable: the learner writes on paper under
  // the desk camera and presses to check. Enter posts a capture command; the
  // phone answers in the room and the lenses poll for it.
  function currentTok() {
    words = Sulat.syllabify(input.value);
    var units = lensUnits();
    if (!units.length) { return null; }
    unitIndex = (unitIndex + units.length) % units.length;
    return units[unitIndex].tok.text;
  }

  function setTryTitle(tok) {
    $('lensWord').innerHTML = 'Write <span class="tok">' + escLensTip(tok) + '</span> on paper';
  }
  function renderCode(code) {
    var box = $('lensCode');
    box.innerHTML = '';
    box.classList.toggle('long', String(code).length > 4);
    box.setAttribute('aria-label', 'Phone code ' + code);
    String(code).split('').forEach(function (ch) {
      var d = document.createElement('span');
      d.className = 'digit';
      d.textContent = ch;
      box.appendChild(d);
    });
  }

  function openTry() {
    if (!pack) { return; }
    var text = currentTok();
    if (!text) { return; }
    clearTimeout(lensTimer);
    if (ctrl) { try { ctrl.stop(); } catch (e) { /* already stopped */ } }
    tryTok = text;
    lensMode = 'try';
    $('lensStage').innerHTML = '';
    setTryTitle(text);
    $('lensCount').textContent = 'Phone code: ' + roomCode;
    renderCode(roomCode);
    $('lensNote').textContent = '';
    setLensUI();
  }

  function postCapture(text) {
    lensMode = 'checking';
    clearTimeout(lensTimer);
    $('lensWord').textContent = 'Checking…';
    $('lensNote').textContent = '';
    setLensUI();
    fetch('/api/room', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: roomCode, action: 'capture', target: text })
    }).then(function (res) {
      return res.ok ? res.json() : Promise.reject(new Error('room ' + res.status));
    }).then(function (data) {
      if (!data || !data.command) { throw new Error('no command'); }
      pendingCmd = data.command;
      tryTok = data.command.target || text;
      pollLens(90);
    }).catch(function () {
      lensMode = 'try';
      setTryTitle(tryTok);
      $('lensNote').textContent = 'Room unreachable. Enter to try again.';
      setLensUI();
    });
  }

  function pollLens(left) {
    clearTimeout(lensTimer);
    if (!pendingCmd) { return; }
    if (left <= 0) {
      lensMode = 'try';
      $('lensNote').textContent = 'No answer from the phone. Is desk camera on?';
      setLensUI();
      return;
    }
    var want = pendingCmd ? pendingCmd.id : null;
    lensTimer = setTimeout(function () {
      fetch('/api/room?code=' + encodeURIComponent(roomCode), { cache: 'no-store' }).then(function (res) {
        return res.ok ? res.json() : null;
      }).then(function (room) {
        if (lensMode !== 'checking' || !pendingCmd || pendingCmd.id !== want) { return; }
        if (room && room.result && room.result.id === want) { showVerdict(room.result); }
        else { pollLens(left - 1); }
      }).catch(function () { if (lensMode === 'checking') { pollLens(left - 1); } });
    }, 1000);
  }

  function showVerdict(found) {
    if (lensMode !== 'checking') { return; }
    clearTimeout(lensTimer);
    lensMode = 'verdict';
    $('lensWord').textContent = found.verdict === 'good' ? 'Magaling!'
      : (found.verdict === 'almost' ? 'Almost!' : 'Try again');
    var shown = found.verdict === 'good'
      ? orderTips(found.tips).slice(0, 1)
      : orderTips(found.tips);
    $('lensNote').innerHTML = shown.map(escLensTip).join('<br>');
    if (found.verdict === 'good') { playAudio('magaling'); }
    lastVerdict = found.verdict;
    var head = $('vHead');
    head.textContent = $('lensWord').textContent;
    head.className = found.verdict === 'good' ? 'good' : (found.verdict === 'almost' ? 'almost' : 'retry');
    void head.offsetWidth;
    head.classList.add('pop');
    $('vTips').innerHTML = $('lensNote').innerHTML;
    var burst = $('vBurst');
    burst.classList.remove('on');
    if (found.verdict === 'good') {
      void burst.offsetWidth;
      burst.classList.add('on');
      var curChip = document.querySelector('#lensChips .chip.cur');
      if (curChip) { curChip.classList.remove('cur'); curChip.classList.add('done'); }
    }
    setLensUI();
  }

  function go(url) {
    if (window.__sulatNav) { window.__sulatNav(url); } else { window.location.replace(url); }
  }

  STARTERS.forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '';
    b.appendChild(document.createTextNode(s.text));
    var sm = document.createElement('small');
    sm.textContent = s.en;
    b.appendChild(sm);
    b.addEventListener('click', function () { input.value = s.text; renderPhrase(); });
    $('starters').appendChild(b);
  });

  $('go').addEventListener('click', renderPhrase);
  $('replay').addEventListener('click', replay);
  $('lensReplay').addEventListener('click', lensPrimary);
  $('slow').addEventListener('click', function () {
    speed = speed < 1 ? 1 : 0.55;
    $('slow').setAttribute('aria-pressed', speed < 1 ? 'true' : 'false');
    updateLensLink();
    replay();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); renderPhrase(); }
  });
  input.addEventListener('input', updateLensLink);

  // The Neural Band arrives as arrow keys and Enter.
  document.addEventListener('keydown', function (e) {
    if (e.target === input) { return; }
    if (glasses) { flashKey(e.key); }
    if (glasses) {
      if (e.key === 'ArrowRight') { e.preventDefault(); unitIndex += 1; renderLensUnit(); }
      else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (lensMode === 'show') { unitIndex -= 1; }
        renderLensUnit();
      }
      else if (e.key === 'ArrowDown') { e.preventDefault(); openTry(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (lensMode === 'show') { go('glasses.html'); } else { renderLensUnit(); } }
      else if ((e.key === 'Enter' || e.key === ' ') && e.target !== $('lensReplay')) {
        e.preventDefault();
        lensPrimary();
      }
    } else if (e.key === 'Enter' && e.target === document.body) {
      e.preventDefault();
      replay();
    }
  });

  Sulat.loadPack('packs/baybayin.json').then(function (p) {
    pack = p;
    if (glasses) { renderLensUnit(); } else { renderPhrase(); }
  }).catch(function (err) {
    var msg = 'Couldn’t load packs/baybayin.json. Open this page from your Sulat site, not as a local file. (' + err.message + ')';
    if (glasses) { $('lensWord').textContent = msg; } else { status(msg); }
  });
})();
</script>
<script>
(function () {
  'use strict';
  var btn = document.getElementById('sound');
  function off() { try { return window.localStorage.getItem('sulat.sound') === 'off'; } catch (e) { return false; } }
  function paint() { var o = off(); btn.setAttribute('aria-pressed', o ? 'true' : 'false'); btn.setAttribute('aria-label', o ? 'Sound off. Tap to turn on' : 'Sound on. Tap to turn off'); }
  btn.addEventListener('click', function () { try { window.localStorage.setItem('sulat.sound', off() ? 'on' : 'off'); } catch (e) { /* private mode */ } paint(); });
  paint();
})();
</script>
</body>
</html>
