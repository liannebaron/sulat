<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sulat</title>
<style>
  /* Built for the Ray-Ban Display: black is see-through, so everything is bright white,
     large, and one idea per screen. Also works in any browser. */
  :root { --ink: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); }
  body { font-family: Georgia, "Times New Roman", serif; }
  main {
    width: min(100vw, 600px);
    height: min(100vh, 600px);
    margin: 0 auto;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 44px; font-weight: 400; }
  h1 small { margin-left: 12px; font-size: 26px; opacity: 0.85; }
  #count { font-size: 26px; }
  .pick { display: flex; align-items: center; gap: 12px; }
  .pick .text { flex: 1; text-align: center; }
  #phrase { font-size: 58px; line-height: 1.1; }
  #english { margin-top: 10px; font-size: 32px; opacity: 0.85; }
  .step {
    flex: none; width: 64px; min-height: 88px;
    font: 44px Georgia, serif; color: var(--ink);
    background: transparent; border: 0; cursor: pointer;
  }
  .bottom { display: flex; align-items: center; gap: 24px; }
  #start {
    min-width: 190px; min-height: 88px; padding: 0 24px;
    font: 30px Georgia, "Times New Roman", serif; color: var(--ink);
    background: transparent; border: 3px solid var(--ink); border-radius: 16px; cursor: pointer;
  }
  #start:focus-visible { outline: 4px solid var(--ink); outline-offset: 5px; }
  #hint { font-size: 24px; line-height: 1.3; }
  .talk { position: fixed; right: 12px; bottom: 8px; font: 14px -apple-system, Helvetica, Arial, sans-serif; opacity: 0.6; }
  .talk a { color: var(--ink); }
  @media (max-height: 560px) { #phrase { font-size: 44px; } #english { font-size: 26px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sulat<small>Tagalog</small></h1>
    <span id="count" aria-live="polite"></span>
  </header>

  <div class="pick">
    <button class="step" id="prev" type="button" tabindex="-1" aria-label="Previous phrase">‹</button>
    <div class="text" aria-live="polite">
      <div id="phrase"></div>
      <div id="english"></div>
    </div>
    <button class="step" id="next" type="button" tabindex="-1" aria-label="Next phrase">›</button>
  </div>

  <div class="bottom">
    <button id="start" type="button">Show me</button>
    <div id="hint">← → choose a phrase<br>Select to start</div>
  </div>
</main>
<div class="talk"><a href="talk.html">Talk to Sulat</a> · <a href="hello.html">Input test</a></div>

<script>
(function () {
  'use strict';

  var PHRASES = [
    { text: 'mahal kita', en: 'I love you' },
    { text: 'salamat', en: 'thank you' },
    { text: 'kumusta', en: 'how are you' },
    { text: 'magandang umaga', en: 'good morning' },
    { text: 'paalam', en: 'goodbye' }
  ];

  var i = 0;
  var $ = function (id) { return document.getElementById(id); };

  function go(url) {
    if (window.__sulatNav) { window.__sulatNav(url); } else { window.location.replace(url); }
  }

  function show() {
    i = (i + PHRASES.length) % PHRASES.length;
    $('phrase').textContent = PHRASES[i].text;
    $('english').textContent = PHRASES[i].en;
    $('count').textContent = (i + 1) + ' / ' + PHRASES.length;
  }

  function start() {
    go('animate.html?view=glasses&text=' + encodeURIComponent(PHRASES[i].text));
  }

  // The Neural Band arrives as arrow keys, and Select as a click on the focused button.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); i += 1; show(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); i -= 1; show(); }
    else if ((e.key === 'Enter' || e.key === ' ') && e.target !== $('start')) { e.preventDefault(); start(); }
  });
  $('prev').addEventListener('click', function () { i -= 1; show(); });
  $('next').addEventListener('click', function () { i += 1; show(); });
  $('start').addEventListener('click', start);

  show();
  $('start').focus();
})();
</script>
</body>
</html>
