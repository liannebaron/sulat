<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sulat · Practice</title>
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="phone.css">
<style>
  /* Practice: the shared phone look (phone.css) plus the lesson pieces. Drawing, scoring and flow are unchanged. */
  html, body { overscroll-behavior: none; }
  /* Pencil taps and quick marks must never select page text (found in the family study). */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, #copyStatus { -webkit-user-select: text; user-select: text; }
  [hidden] { display: none !important; }
  .prac section { display: flex; flex-direction: column; gap: 12px; }
  .marina img { width: 80px; }
  .bubble { padding: 10px 16px; }
  .bubble .hi { font-size: 30px; }
  .bubble .hi.good { color: #2A7A3B; }
  .bubble .hi.almost { color: #8A5E0E; }
  .bubble .hi.retry { color: #A8402E; }
  .bubble .say { margin: 5px 0 0; font-size: 15px; line-height: 1.3; text-wrap: balance; min-height: 0; }
  .bubble .say:empty { display: none; }
  .bubble .say2 { margin: 3px 0 0; font-size: 14px; line-height: 1.3; color: var(--quiet); font-style: italic; text-wrap: balance; }
  .bubble .say2:empty { display: none; }
  .barR { display: flex; align-items: center; gap: 8px; }
  .backrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .backbtn { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 16px 0 10px; box-sizing: border-box; border-radius: 999px; background: var(--cream); border: 1.5px solid var(--tan); color: var(--leaf); font: 600 15px Figtree, sans-serif; text-decoration: none; cursor: pointer; touch-action: manipulation; }
  #where { font-size: 14px; color: var(--muted); white-space: nowrap; }
  /* start */
  #phrases { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #phrases button { min-height: 44px; padding: 0 16px; border: 1.5px solid var(--tan); border-radius: 999px; background: var(--cream); color: var(--ink); font: 600 15px Figtree, sans-serif; white-space: nowrap; box-shadow: 0 3px 0 var(--tan); cursor: pointer; touch-action: manipulation; }
  #phrases button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--cream); box-shadow: 0 3px 0 var(--leaf-dark); }
  .panel { padding: 14px 16px 12px; background-color: var(--cream); border: 1.5px solid var(--tan); border-radius: 18px; box-shadow: 0 3px 0 var(--tan), 0 12px 20px -14px rgba(91,70,30,0.45); }
  #phraseView svg { display: block; width: 100%; height: auto; max-height: 190px; color: var(--ink); }
  #phraseView .label { fill: var(--muted); font-family: Figtree, system-ui, sans-serif; font-weight: 600; }
  #phraseLine { margin: 8px 0 0; font-size: 20px; font-weight: 700; }
  .steps3 { display: flex; gap: 8px; }
  .steps3 div { flex: 1; display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--cream); border: 1.5px solid var(--tan); border-radius: 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .steps3 span { width: 24px; height: 24px; border-radius: 12px; background: var(--leaf); color: var(--cream); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .peekhint { margin: 0; text-align: center; font-size: 14px; color: var(--muted); }
  #introStatus { margin: 0; color: var(--muted); font-size: 14px; }
  #scorerStamp { margin: 0; color: var(--muted); font-size: 11px; text-align: center; opacity: 0.7; }
  .bigbtn { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; min-height: 58px; border-radius: 16px; border: 0; background: var(--leaf); color: var(--cream); font: 700 18px Figtree, sans-serif; box-shadow: 0 4px 0 var(--leaf-dark); cursor: pointer; touch-action: manipulation; }
  .bigbtn:disabled { opacity: 0.5; }
  /* lesson */
  #progress { display: grid; gap: 6px; }
  #progress div { display: flex; flex-direction: column; gap: 4px; align-items: center; min-width: 0; }
  #progress .bar5 { width: 100%; height: 10px; border-radius: 5px; background: #EFE6D2; }
  #progress .done .bar5 { background: var(--leaf); }
  #progress .cur .bar5 { background: repeating-linear-gradient(135deg, #E6B43C 0 6px, #F4D88A 6px 12px); }
  #progress span.t { font-size: 13px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #progress .cur span.t { color: var(--ink); font-weight: 700; }
  .labelrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  #cue { min-width: 0; }
  #cueBig { display: block; font-size: 38px; font-weight: 700; line-height: 1; }
  #cueSmall { display: block; margin-top: 4px; font-size: 13px; line-height: 1.3; color: var(--muted); }
  #cueSmall:empty { display: none; }
  #phaseName { flex: none; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 12px; white-space: nowrap; background: var(--sage); color: var(--leaf); }
  #phaseName { display: inline-flex; align-items: center; gap: 6px; }
  #phaseName svg { display: block; }
  #phaseName.mem { background: #FBEBC0; color: #7A5A0C; }
  #lessonCard[data-phase="tryIntro"] .stagebox { display: none; }
  .stagebox { position: relative; width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 1 / 1; background: #FFFFFF; border: 1.5px solid var(--tan); border-radius: 18px; box-shadow: 0 3px 0 var(--tan); overflow: hidden; }
  #show { position: absolute; inset: 0; pointer-events: none; color: var(--ink); }
  #show svg { display: block; width: 100%; height: 100%; }
  #pad { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #actions { display: flex; gap: 8px; }
  #actions button { flex: 1; min-width: 0; min-height: 52px; padding: 0 8px; border-radius: 14px; border: 1.5px solid var(--tan); background: #FFFFFF; color: var(--leaf); font: 600 15px Figtree, sans-serif; white-space: nowrap; box-shadow: 0 3px 0 var(--tan); cursor: pointer; touch-action: manipulation; }
  #actions.stack { flex-wrap: wrap; }
  #actions.stack button { flex: 1 1 0; }
  #actions.stack button.primary { order: -1; flex: 1 0 100%; }
  #actions button.primary { flex: 1.3; background: var(--leaf); border-color: var(--leaf); color: var(--cream); font-weight: 700; font-size: 16px; box-shadow: 0 3px 0 var(--leaf-dark); }
  /* results */
  #tiles { display: flex; gap: 8px; }
  #tiles .tile { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; background: var(--cream); border: 1.5px solid var(--tan); border-radius: 14px; box-shadow: 0 3px 0 var(--tan); }
  #tiles .tile b { font-size: 20px; }
  #summary { margin: 0; text-align: center; font-size: 14px; color: var(--quiet); }
  .nextcard { display: flex; flex-direction: column; gap: 10px; padding: 16px; background-color: var(--sage); border: 1.5px solid var(--sage-edge); border-radius: 18px; box-shadow: 0 3px 0 var(--sage-edge); }
  .nextcard .t { display: flex; gap: 12px; align-items: center; font-size: 17px; font-weight: 700; line-height: 1.25; color: var(--leaf); }
  .nextcard img { width: 44px; height: auto; display: block; flex: none; }
  details.panel summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--quiet); }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--tan); }
  th { color: var(--muted); font-weight: 500; }
  .ok { color: #2A7A3B; }
  .no { color: #8A5E0E; }
  .twin { display: flex; gap: 8px; }
  .twin button { flex: 1; min-height: 46px; border-radius: 14px; border: 1.5px solid var(--tan); background: #FFFFFF; color: var(--leaf); font: 600 15px Figtree, sans-serif; white-space: nowrap; box-shadow: 0 3px 0 var(--tan); cursor: pointer; }
  .linkbtn { min-height: 44px; border: 0; background: transparent; color: var(--leaf); font: 600 14px Figtree, sans-serif; text-decoration: underline; cursor: pointer; }
  #copyStatus { margin: 0; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="page prac">
  <div class="bar">
    <a href="index.html?view=phone" aria-label="Sulat home"><img src="img/wordmark-green.png" alt="Sulat"></a>
    <div class="barR">
      <button type="button" class="backbtn" id="topBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back</button>
      <button type="button" class="iconbtn" id="sound" aria-pressed="false" aria-label="Sound on. Tap to turn off"><svg class="on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg><svg class="off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9l5 6M22 9l-5 6"></path></svg></button>
    </div>
  </div>

  <section id="introCard">
    <div class="marina">
      <img src="img/marina.webp" alt="Marina">
      <div class="bubble">
        <p class="hi">Learn it with me!</p>
        <p class="say" style="white-space: nowrap">Watch, trace, then write it.</p>
      </div>
    </div>
    <div id="phrases"></div>
    <div class="panel bamboo">
      <div id="phraseView"></div>
      <p id="phraseLine"></p>
    </div>
    <div class="steps3"><div><span>1</span>Watch</div><div><span>2</span>Trace</div><div><span>3</span>From memory</div></div>
    <p class="peekhint">Stuck on the last step? Tap Peek.</p>
    <input id="learner" type="hidden" value="">
    <ol id="sylList" hidden></ol>
    <button id="startBtn" type="button" class="bigbtn">Start the lesson</button>
    <p id="introStatus" role="status"></p>
    <p id="scorerStamp"></p>
  </section>

  <section id="lessonCard" hidden>
    <span id="where" hidden></span>
    <div id="progress" aria-label="Lesson progress"></div>
    <div class="labelrow">
      <div id="cue">
        <span id="cueBig"></span>
        <span id="cueSmall"></span>
      </div>
      <span id="phaseName"></span>
    </div>
    <div class="marina">
      <img src="img/marina.webp" alt="Marina">
      <div class="bubble">
        <p class="hi" id="bubbleHead"></p>
        <p class="say" id="feedback" role="status" aria-live="polite"></p>
        <p class="say2" id="tip"></p>
      </div>
    </div>
    <div class="stagebox">
      <canvas id="pad" aria-label="Writing area"></canvas>
      <div id="show"></div>
    </div>
    <div id="actions"></div>
  </section>

  <section id="doneCard" hidden>
    <div class="marina">
      <img src="img/marina.webp" alt="Marina" style="width: 96px">
      <div class="bubble">
        <p class="hi good" id="doneHead" style="font-size: 36px"></p>
        <p class="say" id="doneTitle"></p>
      </div>
    </div>
    <div id="tiles"></div>
    <p id="summary"></p>
    <div class="nextcard bamboo">
      <div class="t"><img src="img/sampaguita.webp" alt=""><span>Now try it with a real pen.</span></div>
      <a class="bigbtn" id="paperBtn" href="paper.html" style="min-height: 56px; font-size: 17px">Write it on paper</a>
    </div>
    <div class="twin">
      <button id="again" type="button">Practice again</button>
      <button id="other" type="button">Another phrase</button>
    </div>
    <details class="panel">
      <summary>Details</summary>
      <table>
        <thead><tr><th>Syllable</th><th>Tracing</th><th>From memory</th></tr></thead>
        <tbody id="results"></tbody>
      </table>
    </details>
    <button id="copy" type="button" class="linkbtn">Copy results</button>
    <p id="copyStatus" role="status"></p>
  </section>
</div>

<script src="sulat-engine.js?v=3"></script>
<script src="sulat-score.js?v=legible-2"></script>
<script>
(function () {
  'use strict';

  var STARTERS = [
    { text: 'mahal kita', en: 'I love you' },
    { text: 'salamat', en: 'thank you' },
    { text: 'kumusta', en: 'how are you' },
    { text: 'magandang umaga', en: 'good morning' },
    { text: 'paalam', en: 'goodbye' }
  ];
  // Built with Muse Code: Tagalog voice clips recorded by my mother.
  // Sound never blocks the lesson: a failed play is silently ignored.
  var AUDIO_PHRASES = { 'mahal kita': 1, salamat: 1, kumusta: 1, 'magandang umaga': 1, paalam: 1 };
  function playAudio(name) {
    try { if (window.localStorage.getItem('sulat.sound') === 'off') { return; } } catch (e) { /* storage unavailable: sound stays on */ }
    try {
      var p = new Audio('audio/' + name + '.mp3').play();
      if (p && p.catch) { p.catch(function () { /* no sound: keep going */ }); }
    } catch (e) { /* audio unsupported: keep going */ }
  }
  function playPhrase(text) {
    var key = String(text || '').toLowerCase().trim().replace(/\s+/g, ' ');
    if (AUDIO_PHRASES[key]) { playAudio(key.replace(/ /g, '-')); }
  }
  var PAGE_VERSION = 'practice-nov2b';
  var SPEED = 0.75;          // a little slower than Show me, for learners
  var INK = 24;              // stroke width in glyph units
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(window.location.search);

  var pack = null;
  var st = { text: params.get('text') || 'mahal kita', tokens: [], idx: 0, phase: 'intro', results: [], learner: '' };
  var cur = null;            // the syllable being taught
  var user = [];             // learner strokes, in glyph units
  var drawing = null;        // stroke in progress
  var checked = false;       // drawing is locked after Check until Try again
  var ctrl = null;           // Show me animation controller
  var lastPenAt = -99999;    // when the Pencil last touched, so a resting palm can be ignored

  var pad = $('pad');
  var ctx = pad.getContext('2d');
  var size = 0, dpr = 1;
  var map = { k: 1, ox: 0, oy: 0 };

  function englishFor(text) {
    var t = Sulat.normalize(text);
    for (var i = 0; i < STARTERS.length; i++) { if (STARTERS[i].text === t) { return STARTERS[i].en; } }
    return '';
  }

  /* ---------- geometry ---------- */

  // Smooth the stored anchor points the same way the drawing path does.
  function dense(points) {
    if (points.length === 1) { return [{ x: points[0][0], y: points[0][1] }]; }
    var out = [];
    for (var i = 0; i < points.length - 1; i++) {
      var p0 = points[i - 1] || points[i], p1 = points[i], p2 = points[i + 1], p3 = points[i + 2] || points[i + 1];
      var c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      var c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      for (var k = 0; k < 10; k++) {
        var t = k / 10, a = (1 - t) * (1 - t) * (1 - t), b = 3 * (1 - t) * (1 - t) * t, c = 3 * (1 - t) * t * t, d = t * t * t;
        out.push({ x: a * p1[0] + b * c1[0] + c * c2[0] + d * p2[0], y: a * p1[1] + b * c1[1] + c * c2[1] + d * p2[1] });
      }
    }
    var last = points[points.length - 1];
    out.push({ x: last[0], y: last[1] });
    return out;
  }

  function buildSyllable(tok) {
    var lay = Sulat.layout(pack, [{ text: tok.text, tokens: [tok] }], { pad: 110 });
    var it = lay.items[0];
    var strokes = [];
    function add(s, dx, dy) {
      strokes.push({
        path: s.path, dx: dx, dy: dy, dot: s.kind === 'dot',
        pts: dense(s.points).map(function (p) { return { x: p.x + dx, y: p.y + dy }; })
      });
    }
    pack.glyphs[it.base].strokes.forEach(function (s) { add(s, it.dx, it.dy); });
    var opts = { markStrokes: 0, markSide: null, markKind: 'dot' };
    if (it.mark) {
      var mg = pack.glyphs[it.mark.id];
      mg.strokes.forEach(function (s) { add(s, it.mark.dx, it.mark.dy); });
      opts.markStrokes = mg.strokes.length;
      opts.markSide = it.mark.id === 'mark-i' ? 'above' : 'below';
      opts.markKind = it.mark.id === 'mark-virama' ? 'cross' : 'dot';
    }
    return { tok: tok, lay: lay, strokes: strokes, opts: opts };
  }

  // The other letters, drawn with the same vowel mark, so the scorer can tell whether a from-memory
  // attempt is clearly closer to a different letter. Built once per syllable.
  function alternativesFor(c) {
    if (c.alts) { return c.alts; }
    var out = [];
    Object.keys(pack.glyphs).forEach(function (gid) {
      if (gid.indexOf('mark') === 0 || gid === c.tok.base) { return; }
      try {
        var b = buildSyllable({ text: c.tok.text, base: gid, mark: c.tok.mark });
        out.push({ strokes: b.strokes });
      } catch (e) { /* skip a glyph that cannot be laid out */ }
    });
    c.alts = out;
    return out;
  }

  function resize() {
    var r = pad.getBoundingClientRect();
    if (!r.width) { return; }
    dpr = window.devicePixelRatio || 1;
    size = r.width;
    pad.width = Math.round(size * dpr);
    pad.height = Math.round(size * dpr);
    computeMap();
    redraw();
  }

  function computeMap() {
    if (!cur || !size) { return; }
    var vb = cur.lay.viewBox;
    var k = Math.min(size / vb[2], size / vb[3]);
    map = { k: k, ox: (size - vb[2] * k) / 2 - vb[0] * k, oy: (size - vb[3] * k) / 2 - vb[1] * k };
  }

  function toGlyph(e) {
    var r = pad.getBoundingClientRect();
    var X = (e.clientX - r.left) * (size / r.width);
    var Y = (e.clientY - r.top) * (size / r.height);
    return { x: (X - map.ox) / map.k, y: (Y - map.oy) / map.k };
  }

  /* ---------- drawing ---------- */

  function withGlyphSpace(fn) {
    ctx.save();
    ctx.setTransform(dpr * map.k, 0, 0, dpr * map.k, dpr * map.ox, dpr * map.oy);
    fn();
    ctx.restore();
  }

  function drawRef(color, tf) {
    // tf maps the reference into the learner's own position and size (for the ghost reveal).
    var sc = 1, tx = 0, ty = 0;
    if (tf) { sc = 1 / tf.s; tx = tf.ux - tf.rx / tf.s; ty = tf.uy - tf.ry / tf.s; }
    ctx.save();
    ctx.setTransform(dpr * map.k * sc, 0, 0, dpr * map.k * sc, dpr * (map.ox + map.k * tx), dpr * (map.oy + map.k * ty));
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    cur.strokes.forEach(function (s) {
      ctx.save();
      ctx.translate(s.dx, s.dy);
      ctx.lineWidth = (s.dot ? 34 : INK) * (tf ? tf.s : 1);
      ctx.stroke(new Path2D(s.path));
      ctx.restore();
    });
    ctx.restore();
  }

  function pointAlong(pts, d) {
    var acc = 0;
    for (var i = 1; i < pts.length; i++) {
      var seg = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      if (acc + seg >= d) {
        var t = (d - acc) / seg;
        return { x: pts[i - 1].x + t * (pts[i].x - pts[i - 1].x), y: pts[i - 1].y + t * (pts[i].y - pts[i - 1].y) };
      }
      acc += seg;
    }
    return pts[pts.length - 1];
  }

  function drawMarkers() {
    withGlyphSpace(function () {
      var placed = [];
      cur.strokes.forEach(function (s, i) {
        var p = s.pts[0];
        if (!s.dot && s.pts.length > 3) {
          // a short arrow showing which way the stroke starts
          var q = pointAlong(s.pts, 80);
          var ang = Math.atan2(q.y - p.y, q.x - p.x);
          ctx.strokeStyle = 'rgba(47,90,54,0.95)';
          ctx.lineWidth = 7;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
          ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - 24 * Math.cos(ang - 0.5), q.y - 24 * Math.sin(ang - 0.5));
          ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - 24 * Math.cos(ang + 0.5), q.y - 24 * Math.sin(ang + 0.5));
          ctx.stroke();
        }
        var mx = p.x - 38, my = p.y - 38;
        for (var tries = 0; tries < 6; tries++) {
          var clash = placed.some(function (o) { return Math.abs(o.x - mx) < 44 && Math.abs(o.y - my) < 44; });
          if (!clash) { break; }
          mx -= 44;
        }
        placed.push({ x: mx, y: my });
        ctx.fillStyle = 'rgba(47,90,54,0.96)';
        ctx.beginPath(); ctx.arc(mx, my, 21, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px -apple-system, Helvetica, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(i + 1), mx, my + 1);
      });
    });
  }

  function drawStroke(pts) {
    if (pts.length === 1) {
      ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 17, 0, Math.PI * 2); ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) { ctx.lineTo(pts[i].x, pts[i].y); }
    ctx.stroke();
  }

  function drawUser() {
    withGlyphSpace(function () {
      ctx.strokeStyle = '#1E2A1F';
      ctx.fillStyle = '#1E2A1F';
      ctx.lineWidth = INK;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      user.forEach(function (s) { drawStroke(s.pts); });
      if (drawing) { drawStroke(drawing.pts); }
    });
  }

  var ghost = null;
  var peeking = false, peekTimer = null;
  function redraw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    if (!cur) { return; }
    if (st.phase === 'trace') { drawRef('#CBD5BE'); drawMarkers(); }
    if (peeking && st.phase === 'try') { drawRef('#CBD5BE'); }
    drawUser();
    if (ghost) { drawRef('rgba(47,90,54,0.34)', ghost); }
  }

  /* ---------- pointer input ---------- */

  function canDraw() { return (st.phase === 'trace' || st.phase === 'try') && !checked; }

  pad.addEventListener('pointerdown', function (e) {
    if (!canDraw()) { return; }
    var now = performance.now();
    if (e.pointerType === 'pen') { lastPenAt = now; }
    if (drawing) {
      // A resting palm can start a stroke before the Pencil lands. The Pencil wins.
      if (e.pointerType === 'pen' && drawing.type === 'touch') { drawing = null; }
      // A quick second Pencil mark (like the two lines of a cross) can arrive before the first one ends.
      // A Pencil can only be in one place, so end the first mark and keep both.
      else if (e.pointerType === 'pen' && drawing.type === 'pen' && e.pointerId !== drawing.pid) { finish(); }
      else { return; }
    }
    // Ignore touches only while the Pencil is in use, so a finger works again a moment later.
    if (e.pointerType === 'touch' && now - lastPenAt < 1200) { return; }
    if (e.pointerType === 'mouse' && e.button > 0) { return; }
    e.preventDefault();
    try { pad.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
    drawing = { pid: e.pointerId, type: e.pointerType, pts: [toGlyph(e)] };
    redraw();
  });

  pad.addEventListener('pointermove', function (e) {
    if (!drawing || e.pointerId !== drawing.pid) { return; }
    e.preventDefault();
    if (e.pointerType === 'pen') { lastPenAt = performance.now(); }
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (!evs.length) { evs = [e]; }
    for (var i = 0; i < evs.length; i++) {
      var p = toGlyph(evs[i]);
      var last = drawing.pts[drawing.pts.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) < 2) { continue; }
      drawing.pts.push(p);
    }
    redraw();
  });

  function finish(e) {
    if (!drawing || (e && e.pointerId !== drawing.pid)) { return; }
    user.push({ pts: drawing.pts });
    drawing = null;
    redraw();
  }
  pad.addEventListener('pointerup', finish);
  pad.addEventListener('pointercancel', finish);
  pad.addEventListener('lostpointercapture', finish);
  window.addEventListener('pointerup', finish);
  pad.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- lesson flow ---------- */

  function setActions(list) {
    var host = $('actions');
    host.innerHTML = '';
    list.forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button';
      el.textContent = b.label;
      if (b.primary) { el.className = 'primary'; }
      el.addEventListener('click', b.fn);
      host.appendChild(el);
    });
    host.className = (list.length === 3 && list.some(function (b) { return b.label.length > 12; })) ? 'stack' : '';
  }

  var RETRY_ISSUES = { lookalike: 1, count: 1, missing: 1, shape: 1 };
  function say(text, kind, tip, issue) {
    var f = $('feedback');
    f.textContent = text || '';
    $('tip').textContent = tip || '';
    var h = $('bubbleHead'), word, cls = '';
    if (kind === 'good') { word = 'Magaling!'; cls = 'good'; }
    else if (kind === 'bad') {
      if (issue === 'empty') { word = 'Draw it first!'; cls = 'almost'; }
      else if (RETRY_ISSUES[issue]) { word = 'Try again'; cls = 'retry'; }
      else { word = 'Almost!'; cls = 'almost'; }
    }
    else if (st.phase === 'show') { word = 'Watch me write it!'; }
    else if (st.phase === 'trace') { word = 'Trace over the guide!'; }
    else if (st.phase === 'tryIntro') { word = 'Now without the guide!'; }
    else { word = 'Now you write it!'; }
    h.textContent = word;
    h.className = 'hi ' + cls;
  }

  // The five-segment progress bar replaces "Syllable n of N".
  function renderProgress() {
    var host = $('progress');
    var n = st.tokens.length;
    host.style.gridTemplateColumns = 'repeat(' + n + ', minmax(0, 1fr))';
    host.innerHTML = '';
    st.tokens.forEach(function (t, k) {
      var r = st.results[k] || {};
      var done, cur;
      if (st.phase === 'tryIntro') { done = false; cur = false; }
      else {
        var passed = st.phase === 'try' ? r.tryPassed : r.tracePassed;
        done = !!passed || k < st.idx;
        cur = !done && k === st.idx;
      }
      var cell = document.createElement('div');
      cell.className = done ? 'done' : (cur ? 'cur' : '');
      cell.innerHTML = '<span class="bar5"></span><span class="t"></span>';
      cell.lastChild.textContent = t.text;
      host.appendChild(cell);
    });
  }

  var PHASE_ICON = {
    Trace: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 14a8 8 0 0 1-8 8"></path><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"></path><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"></path><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"></path><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>',
    Watch: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>'
  };
  function setPhase(name) {
    var el = $('phaseName');
    el.innerHTML = (PHASE_ICON[name] || '') + '<span></span>';
    el.lastChild.textContent = name;
    el.className = name === 'From memory' ? 'mem' : '';
  }
  function header(phaseName) {
    $('where').textContent = st.text;
    setPhase(phaseName);
    $('lessonCard').setAttribute('data-phase', st.phase);
    renderProgress();
  }

  function showSvg(on) { $('show').hidden = !on; }

  function goShow() {
    st.phase = 'show';
    cur = buildSyllable(st.tokens[st.idx]);
    computeMap();
    user = []; drawing = null; checked = false; ghost = null;
    header('Watch');
    $('cueBig').textContent = cur.tok.text;
    $('cueSmall').textContent = Sulat.describe(cur.tok).replace(/^[^:]*:\s*/, '');
    showSvg(true);
    redraw();
    ctrl = Sulat.render($('show'), pack, cur.lay, { ink: INK, dotInk: 34, ariaLabel: cur.tok.text + ' in Baybayin' });
    ctrl.play({ speed: SPEED });
    say('Watch the order of the strokes.');
    setActions([
      { label: 'Replay', fn: function () { ctrl.play({ speed: SPEED }); } },
      { label: 'Trace it →', primary: true, fn: goTrace }
    ]);
  }

  function goTrace() {
    if (ctrl) { ctrl.stop(); }
    st.phase = 'trace';
    user = []; drawing = null; checked = false; ghost = null;
    header('Trace');
    showSvg(false);
    redraw();
    say('Follow the numbers and arrows.');
    drawActions();
  }

  // Undo, Clear, Peek (from memory only), Check. Undo and Peek were asked for in the family study.
  function drawActions() {
    var list = [{ label: 'Undo', fn: undo }, { label: 'Clear', fn: clearInk }];
    if (st.phase === 'try') { list.push({ label: 'Peek', fn: peek }); }
    list.push({ label: 'Check', primary: true, fn: check });
    setActions(list);
  }

  function undo() {
    if (checked || !user.length) { return; }
    user.pop();
    redraw();
  }

  function stopPeek() {
    clearTimeout(peekTimer);
    if (peeking) { peeking = false; $('tip').textContent = ''; }
  }

  // A short look at the letter, logged as a peek rather than a failed try.
  function peek() {
    if (checked || st.phase !== 'try') { return; }
    var r = st.results[st.idx];
    r.peeks = (r.peeks || 0) + 1;
    r.log.push({ phase: 'try', peek: true, at: Date.now() });
    peeking = true;
    redraw();
    $('tip').textContent = 'Have a quick look. It fades in a moment.';
    clearTimeout(peekTimer);
    peekTimer = setTimeout(function () { stopPeek(); redraw(); }, 2000);
  }

  function skip() {
    var r = st.results[st.idx];
    if (r) { r.log.push({ phase: st.phase, skip: true, at: Date.now() }); }
    next();
  }

  function clearInk() {
    user = []; drawing = null; checked = false; ghost = null;
    stopPeek();
    redraw();
    say(st.phase === 'try' ? 'Write “' + cur.tok.text + '” from memory.' : 'Follow the numbers and arrows.');
    drawActions();
  }

  function alignedGhost() {
    if (!user.length) { return null; }
    var R = SulatScore.bbox(cur.strokes), U = SulatScore.bbox(user);
    return { s: R.size / U.size, ux: U.cx, uy: U.cy, rx: R.cx, ry: R.cy };
  }

  function check() {
    if (drawing) { finish(); }
    stopPeek();
    var memory = st.phase === 'try';
    var opts = { mode: memory ? 'memory' : 'trace' };
    Object.keys(cur.opts).forEach(function (k) { opts[k] = cur.opts[k]; });
    if (memory) { opts.alternatives = alternativesFor(cur); }
    var res = SulatScore.score(cur.strokes, user, opts);
    if (res.issue === 'empty') { say(res.message, 'bad', '', 'empty'); return; }
    checked = true;
    var r = st.results[st.idx];
    if (memory) {
      r.tryAttempts += 1;
      // A first try only counts as from memory if the learner did not peek before it.
      if (r.tryFirst === null) {
        r.tryFirst = res.pass && !r.peeks;
        if (r.tryFirst) { playAudio('magaling'); }
      }
      if (res.pass) { r.tryPassed = true; }
      ghost = res.transform || alignedGhost();   // reveal the correct glyph over their attempt
    } else {
      r.traceAttempts += 1;
      if (res.pass) { r.tracePassed = true; }
    }
    r.log.push({ phase: st.phase, pass: res.pass, issue: res.issue, at: Date.now() });
    redraw();
    renderProgress();
    say(res.message, res.pass ? 'good' : 'bad', res.pass ? (res.tip || '') : (memory ? 'The green shows how it’s written.' : ''), res.issue);
    var last = st.idx === st.tokens.length - 1;
    if (res.pass) {
      setActions(memory
        ? [{ label: last ? 'See results →' : 'Next →', primary: true, fn: next }]
        : [{ label: 'Trace again', fn: goTrace }, { label: last ? 'Now from memory →' : 'Next →', primary: true, fn: next }]);
    } else {
      setActions(memory
        ? [{ label: 'Try again', primary: true, fn: clearInk }, { label: last ? 'See results →' : 'Skip →', fn: skip }]
        : [{ label: 'Show me again', fn: goShow }, { label: 'Try again', primary: true, fn: clearInk }, { label: last ? 'Now from memory →' : 'Skip →', fn: skip }]);
    }
  }

  function next() {
    st.idx += 1;
    if (st.phase === 'trace' || st.phase === 'show') {
      if (st.idx < st.tokens.length) { goShow(); } else { goTryIntro(); }
    } else if (st.idx < st.tokens.length) { goTry(); } else { goDone(); }
  }

  function goTryIntro() {
    st.phase = 'tryIntro';
    cur = null; user = []; ghost = null; checked = false;
    showSvg(false);
    redraw();
    $('where').textContent = st.text;
    setPhase('From memory');
    $('lessonCard').setAttribute('data-phase', 'tryIntro');
    renderProgress();
    $('cueBig').textContent = 'From memory';
    $('cueSmall').textContent = '';
    say('No guide this time. Stuck? Tap Peek for a quick look.');
    setActions([{ label: 'Begin', primary: true, fn: function () { st.idx = 0; goTry(); } }]);
  }

  function goTry() {
    st.phase = 'try';
    cur = buildSyllable(st.tokens[st.idx]);
    computeMap();
    user = []; drawing = null; checked = false; ghost = null;
    stopPeek();
    header('From memory');
    $('cueBig').textContent = cur.tok.text;
    $('cueSmall').textContent = '';
    showSvg(false);
    redraw();
    say('Write “' + cur.tok.text + '” from memory.');
    drawActions();
    resize();
  }

  function firstTryCount() {
    return st.results.filter(function (r) { return r.tryFirst === true; }).length;
  }

  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  function traceLabel(r) {
    return (r.tracePassed ? '' : 'skipped after ') + plural(r.traceAttempts, 'try', 'tries');
  }

  function memLabel(r) {
    var s;
    if (r.tryFirst) { s = 'first try'; }
    else if (r.tryPassed && r.tryAttempts === 1) { s = 'first try, after a peek'; }
    else if (r.tryPassed) { s = 'after ' + plural(r.tryAttempts, 'try', 'tries'); }
    else { s = 'not yet (' + plural(r.tryAttempts, 'try', 'tries') + ')'; }
    if (r.peeks && !(r.tryPassed && r.tryAttempts === 1)) { s += ', ' + plural(r.peeks, 'peek', 'peeks'); }
    return s;
  }

  // Why each attempt failed, so a session can be checked for unfair fails afterwards.
  function reasons(r, phase) {
    var c = {}, order = [];
    r.log.forEach(function (e) {
      if (e.phase === phase && e.pass === false && e.issue) {
        if (!c[e.issue]) { c[e.issue] = 0; order.push(e.issue); }
        c[e.issue] += 1;
      }
    });
    return order.length ? ' [missed: ' + order.map(function (k) { return k + (c[k] > 1 ? ' x' + c[k] : ''); }).join(', ') + ']' : '';
  }

  function resultsText() {
    var n = st.results.length;
    var peeks = st.results.reduce(function (a, r) { return a + (r.peeks || 0); }, 0);
    var lines = ['Sulat practice: ' + st.text + (st.learner ? ' (learner: ' + st.learner + ')' : '') + ', ' + new Date().toLocaleString()];
    lines.push('Scorer ' + (SulatScore.version || '?') + ', page ' + PAGE_VERSION);
    lines.push('From memory, right on the first try (no peek): ' + firstTryCount() + ' of ' + n + '. Peeks used: ' + peeks);
    st.results.forEach(function (r) {
      lines.push('- ' + r.text + ': ' + (r.tracePassed ? 'traced in ' : 'trace ') + traceLabel(r) + reasons(r, 'trace') +
        '; from memory ' + (r.tryPassed || r.tryFirst ? 'right ' : '') + memLabel(r) + reasons(r, 'try'));
    });
    return lines.join('\n');
  }

  function goDone() {
    st.phase = 'done';
    $('lessonCard').hidden = true;
    $('doneCard').hidden = false;
    var n = st.results.length, first = firstTryCount();
    var all = st.results.every(function (r) { return r.tryPassed; });
    $('doneHead').textContent = all ? 'Magaling!' : 'Nice work!';
    $('paperBtn').href = 'paper.html?text=' + encodeURIComponent(st.text);
    $('doneTitle').textContent = all ? 'You wrote “' + st.text + '” from memory!' : 'Lesson complete';
    var got = st.results.filter(function (r) { return r.tryPassed; }).length;
    $('summary').textContent = 'First try from memory: ' + first + ' of ' + n + ' · got there in the end: ' + got + ' of ' + n;
    var tiles = $('tiles');
    tiles.innerHTML = '';
    var ICON = {
      first: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A7A3B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="first try"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>',
      later: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C0892A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="got there after a peek or retry"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
      not: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6450" stroke-width="2.4" stroke-linecap="round" role="img" aria-label="not yet"><path d="M6 12h12"></path></svg>'
    };
    st.results.forEach(function (r) {
      var tile = document.createElement('div');
      tile.className = 'tile';
      var b = document.createElement('b');
      b.textContent = r.text;
      tile.appendChild(b);
      tile.insertAdjacentHTML('beforeend', r.tryFirst ? ICON.first : (r.tryPassed ? ICON.later : ICON.not));
      tiles.appendChild(tile);
    });
    var body = $('results');
    body.innerHTML = '';
    st.results.forEach(function (r) {
      var tr = document.createElement('tr');
      var mem = '<span class="' + (r.tryPassed ? 'ok' : 'no') + '">' + memLabel(r) + '</span>';
      tr.innerHTML = '<td>' + r.text + '</td><td>' + traceLabel(r) + '</td><td>' + mem + '</td>';
      body.appendChild(tr);
    });
    try {
      var key = 'sulat.practice.sessions';
      var all2 = JSON.parse(localStorage.getItem(key) || '[]');
      all2.push({ text: st.text, learner: st.learner, at: new Date().toISOString(), results: st.results });
      localStorage.setItem(key, JSON.stringify(all2));
    } catch (e) { /* storage unavailable: the copy button still works */ }
  }

  function showIntro() {
    if (ctrl) { ctrl.stop(); }
    $('lessonCard').hidden = true;
    $('doneCard').hidden = true;
    $('introCard').hidden = false;
    st.phase = 'intro';
    renderIntro();
  }
  function goBack() {
    if (st.phase === 'show' || st.phase === 'trace') {
      if (st.idx > 0) { st.idx -= 1; goShow(); } else { showIntro(); }
    } else if (st.phase === 'tryIntro') {
      st.idx = st.tokens.length - 1; goShow();
    } else if (st.phase === 'try') {
      if (st.idx > 0) { st.idx -= 1; goTry(); } else { goTryIntro(); }
    } else if (st.phase === 'done') {
      $('doneCard').hidden = true;
      $('lessonCard').hidden = false;
      st.idx = st.tokens.length - 1;
      resize();
      goTry();
      resize();
    }
  }

  function startLesson() {
    st.learner = $('learner').value.trim();
    st.idx = 0;
    st.results = st.tokens.map(function (t) {
      return { text: t.text, traceAttempts: 0, tracePassed: false, tryAttempts: 0, tryFirst: null, tryPassed: false, peeks: 0, log: [] };
    });
    $('introCard').hidden = true;
    $('doneCard').hidden = true;
    $('lessonCard').hidden = false;
    resize();
    playPhrase(st.text);
    goShow();
    resize();
  }

  /* ---------- intro ---------- */

  function renderIntro() {
    var words = Sulat.syllabify(st.text);
    st.tokens = [];
    words.forEach(function (w) { w.tokens.forEach(function (t) { st.tokens.push(t); }); });
    var lay = Sulat.layout(pack, words);
    var c = Sulat.render($('phraseView'), pack, lay, { labels: true, labelSize: Math.max(70, 15 * lay.viewBox[2] / ($('phraseView').clientWidth || 318)), ariaLabel: st.text + ' in Baybayin' });
    c.play({ speed: 1 });
    var en = englishFor(st.text);
    $('phraseLine').textContent = st.text + (en ? ' · ' + en : '');
    var list = $('sylList');
    list.innerHTML = '';
    st.tokens.forEach(function (t) {
      var li = document.createElement('li');
      li.textContent = Sulat.describe(t);
      list.appendChild(li);
    });
    var missing = lay.missing.length ? 'Missing from the stroke pack: ' + lay.missing.join(', ') : '';
    $('introStatus').textContent = missing;
    $('startBtn').disabled = !st.tokens.length || !!missing;
    var chips = $('phrases').children;
    for (var i = 0; i < chips.length; i++) {
      chips[i].setAttribute('aria-pressed', chips[i].dataset.text === Sulat.normalize(st.text) ? 'true' : 'false');
    }
  }

  STARTERS.forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.text;
    b.dataset.text = s.text;
    b.addEventListener('click', function () { st.text = s.text; renderIntro(); });
    $('phrases').appendChild(b);
  });

  $('startBtn').addEventListener('click', startLesson);
  $('topBack').addEventListener('click', function () {
    if (st.phase === 'intro') { window.location.href = 'index.html?view=phone'; } else { goBack(); }
  });
  $('again').addEventListener('click', startLesson);
  $('other').addEventListener('click', showIntro);
  $('copy').addEventListener('click', function () {
    var text = resultsText();
    function done(ok) { $('copyStatus').textContent = ok ? 'Copied. Paste it into your notes.' : 'Copy failed. Here it is:\n' + text; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else { done(false); }
  });

  window.addEventListener('resize', resize);
  if ('ResizeObserver' in window) { new ResizeObserver(function () { resize(); }).observe(pad); }

  // For automated tests and debugging only.
  window.SulatPractice = {
    state: st,
    current: function () { return cur; },
    toClient: function (p) {
      var r = pad.getBoundingClientRect();
      return { x: r.left + (p.x * map.k + map.ox) * (r.width / size), y: r.top + (p.y * map.k + map.oy) * (r.height / size) };
    },
    resultsText: resultsText,
    strokeCount: function () { return user.length; },
    isPeeking: function () { return peeking; }
  };

  $('scorerStamp').textContent = 'Scorer: ' + (SulatScore.version || 'OLD version, upload sulat-score.js again') + ' · Page: ' + PAGE_VERSION;

  Sulat.loadPack('packs/baybayin.json').then(function (p) {
    pack = p;
    renderIntro();
  }).catch(function (err) {
    $('introStatus').textContent = 'Couldn’t load the stroke pack. Open this page from your Sulat site. (' + err.message + ')';
    $('startBtn').disabled = true;
  });
})();
</script>
<script>
(function () {
  'use strict';
  var btn = document.getElementById('sound');
  function off() { try { return window.localStorage.getItem('sulat.sound') === 'off'; } catch (e) { return false; } }
  function paint() { var o = off(); btn.setAttribute('aria-pressed', o ? 'true' : 'false'); btn.setAttribute('aria-label', o ? 'Sound off. Tap to turn on' : 'Sound on. Tap to turn off'); }
  btn.addEventListener('click', function () { try { window.localStorage.setItem('sulat.sound', off() ? 'on' : 'off'); } catch (e) { /* private mode */ } paint(); });
  paint();
})();
</script>
</body>
</html>
