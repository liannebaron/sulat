<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sulat · Write it on paper</title>
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="phone.css">
<style>
  /* Paper: write on real paper, then Marina checks it. Two modes on one page:
     photo (this phone takes the picture) and desk (this phone is the camera for the glasses).
     Look only; the camera, room and checking code are unchanged. */
  html, body { overscroll-behavior: none; }
  [hidden] { display: none !important; }
  .paper { gap: 12px; }
  .barR { display: flex; align-items: center; gap: 8px; }
  .backbtn { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 16px 0 10px; border-radius: 999px; background: var(--cream); border: 1.5px solid var(--tan); color: var(--leaf); font: 600 15px Figtree, sans-serif; cursor: pointer; touch-action: manipulation; }
  .modes { display: flex; padding: 3px; border-radius: 999px; background: #F3EBD8; border: 1.5px solid var(--tan); align-self: center; }
  .modes a { min-height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; color: var(--quiet); font: 600 15px Figtree, sans-serif; text-decoration: none; white-space: nowrap; }
  .modes a[aria-current="true"] { background: var(--leaf); color: var(--cream); }
  .marina img { width: 84px; }
  .bubble .hi { font-size: 28px; }
  .bubble .say { white-space: nowrap; font-size: 15px; margin-top: 6px; }
  .bubble .say span { display: block; }
  body.desk .only-photo, body:not(.desk) .only-desk { display: none !important; }
  /* the two cards change places by mode */
  .paper > .marina { order: 1; }
  #compareCard { order: 2; }
  #photoCard { order: 3; }
  #deskCard { order: 3; }
  #result { order: 4; }
  body.desk #deskCard { order: 2; }
  body.desk #result { order: 3; }
  body.desk #compareCard { order: 4; }
  .panel { padding: 14px 16px; background-color: var(--cream); border: 1.5px solid var(--tan); border-radius: 18px; box-shadow: 0 3px 0 var(--tan), 0 12px 20px -14px rgba(91,70,30,0.45); display: flex; flex-direction: column; gap: 10px; }
  .lab { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  /* photo mode */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chips button { min-height: 44px; min-width: 52px; padding: 0 14px; border: 1.5px solid var(--tan); border-radius: 14px; background: var(--cream); color: var(--ink); font: 600 17px Figtree, sans-serif; box-shadow: 0 3px 0 var(--tan); cursor: pointer; touch-action: manipulation; }
  .chips button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--cream); box-shadow: 0 3px 0 var(--leaf-dark); }
  .typeone { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .typeone input { width: 96px; min-height: 40px; padding: 0 10px; font: 600 16px Figtree, sans-serif; color: var(--ink); background: #FFFFFF; border: 1.5px solid var(--tan); border-radius: 10px; }
  .linkbtn { min-height: 40px; border: 0; background: transparent; color: var(--leaf); font: 600 14px Figtree, sans-serif; text-decoration: underline; cursor: pointer; padding: 0 4px; }
  .tip { margin: 0; text-align: center; font-size: 14px; color: var(--quiet); }
  .twin { display: flex; gap: 8px; }
  .twin > * { flex: 1; min-width: 0; }
  .filebtn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 14px; border: 1.5px solid var(--leaf); background: #FFFFFF; color: var(--leaf); font: 700 16px Figtree, sans-serif; cursor: pointer; touch-action: manipulation; white-space: nowrap; }
  .go { min-height: 54px; border-radius: 14px; border: 0; background: var(--leaf); color: var(--cream); font: 700 16px Figtree, sans-serif; box-shadow: 0 4px 0 var(--leaf-dark); cursor: pointer; touch-action: manipulation; white-space: nowrap; }
  .go:disabled { opacity: 0.5; }
  /* desk mode */
  .codein { width: 100%; min-height: 72px; padding: 0 16px; text-align: center; font: 700 44px Figtree, sans-serif; letter-spacing: 0.35em; color: var(--ink); background: #FFFFFF; border: 2px solid var(--leaf); border-radius: 16px; box-shadow: 0 3px 0 var(--leaf); }
  .codein::placeholder { color: #CDBF9F; letter-spacing: 0.35em; }
  #deskTarget { font-size: 22px; font-weight: 700; color: var(--leaf); text-align: center; }
  .bezel { padding: 16px; border-radius: 26px; background: linear-gradient(180deg, #3C6E44 0%, #2B5232 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.28), inset 0 -3px 0 rgba(0,0,0,0.22), 0 6px 0 #1E3D24, 0 18px 24px -16px rgba(30,61,36,0.6); }
  .bezel .lcd { padding: 6px; border-radius: 16px; background: #0E130E; box-shadow: inset 0 4px 8px rgba(0,0,0,0.75); }
  #preview { display: block; width: 100%; height: auto; max-height: 46vh; object-fit: contain; border-radius: 11px; background: #000; }
  .onglasses { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #F3EBD8; font-size: 15px; line-height: 1.35; }
  .onglasses .k { flex: none; height: 34px; padding: 0 10px; border: 2px solid var(--leaf); border-radius: 9px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: var(--leaf); }
  #deskStatus, #status { margin: 0; min-height: 1.3em; text-align: center; font-size: 14px; color: var(--muted); }
  #deskStatus.error, #status.error { color: #A8402E; }
  /* Marina's answer */
  #result { display: flex; align-items: flex-end; gap: 6px; }
  #result > img { width: 72px; height: auto; display: block; flex: none; }
  #result .bubble { margin-bottom: 8px; }
  #verdict { margin: 0; font-family: Caveat, cursive; font-size: 32px; font-weight: 700; line-height: 1; color: var(--leaf); }
  #verdict.good { color: #2A7A3B; }
  #verdict.almost { color: #8A5E0E; }
  #verdict.retry { color: #A8402E; }
  #tips { margin: 6px 0 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.35; }
  #tips li { margin: 3px 0; }
  #timings { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  #timings:empty { display: none; }
  /* your script and Marina's, side by side */
  .compare { display: flex; gap: 12px; }
  .compare figure { flex: 1 1 0; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .compare .slot { width: 100%; aspect-ratio: 1 / 1; background: #FFFFFF; border: 1.5px solid var(--tan); border-radius: 14px; box-shadow: 0 3px 0 var(--tan); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .compare .slot img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .compare figcaption { font-size: 14px; font-weight: 600; color: var(--quiet); text-align: center; }
</style>
</head>
<body>
<script>
  // Desk mode when the glasses sent you here (?mode=desk or a room code); otherwise photo mode. Set before paint.
  (function () {
    var q = new URLSearchParams(window.location.search);
    if (q.get('mode') === 'desk' || q.get('room')) { document.body.className = 'desk'; }
  })();
</script>
<div class="page paper">
  <div class="bar">
    <a href="index.html?view=phone" aria-label="Sulat home"><img src="img/wordmark-green.png" alt="Sulat"></a>
    <div class="barR">
      <button type="button" class="backbtn" id="topBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back</button>
    </div>
  </div>

  <nav class="modes" aria-label="Which camera">
    <a id="modePhoto" href="paper.html">Photo</a>
    <a id="modeDesk" href="paper.html?mode=desk">Glasses desk camera</a>
  </nav>

  <div class="marina only-photo">
    <img src="img/marina.webp" alt="Marina">
    <div class="bubble">
      <p class="hi">Now you write it!</p>
      <p class="say"><span>Dark pen, write big,</span><span>and fill the frame.</span></p>
    </div>
  </div>
  <div class="marina only-desk">
    <img src="img/marina.webp" alt="Marina">
    <div class="bubble">
      <p class="hi">Lend me your eyes!</p>
      <p class="say"><span>Type the code from your glasses,</span><span>then stand me over your paper.</span></p>
    </div>
  </div>

  <section class="panel only-photo" id="photoCard">
    <span class="lab">Pick a letter</span>
    <div class="chips" id="chips"></div>
    <div class="typeone">
      <label for="syl">or type one</label>
      <input id="syl" type="text" value="ma" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="8">
      <button id="moreLetters" type="button" class="linkbtn">More letters</button>
    </div>
    <p class="tip">Write it on paper, then take a photo.</p>
    <div class="twin">
      <label class="filebtn" id="photoLabel" for="photo">Take a photo</label>
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>
      <button id="check" type="button" class="go">Check my writing</button>
    </div>
  </section>

  <section class="panel only-desk" id="deskCard">
    <div id="deskTarget" hidden></div>
    <label class="lab" for="room">Code from your glasses</label>
    <input id="room" class="codein" type="text" inputmode="numeric" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="8" placeholder="0000">
    <button id="desk" type="button" class="go">Pair and turn on camera</button>
    <div class="bezel" id="bezel" hidden><div class="lcd"><video id="preview" playsinline muted hidden></video></div></div>
    <p id="deskStatus" role="status" aria-live="polite"></p>
    <div class="onglasses"><span class="k">Enter</span><span>On your glasses, choose <b>Check my work</b> and I’ll begin.</span></div>
  </section>

  <section id="result" hidden>
    <img src="img/marina.webp" alt="">
    <div class="bubble">
      <h2 id="verdict"></h2>
      <ul id="tips"></ul>
      <p id="timings"></p>
    </div>
  </section>

  <section class="panel" id="compareCard">
    <div class="compare">
      <figure>
        <div class="slot"><img id="seen" alt="Cleaned photo of your handwriting" hidden></div>
        <figcaption id="seenCap">Your script</figcaption>
      </figure>
      <figure id="refWrap" hidden>
        <div class="slot"><img id="ref" alt="Marina’s script"></div>
        <figcaption id="refCap">Marina’s script</figcaption>
      </figure>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
</div>

<script src="sulat-engine.js"></script>
<script src="sulat-photo.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var sylInput = $('syl'), photoInput = $('photo'), checkBtn = $('check');
  var seenCap = $('seenCap'), seen = $('seen'), statusEl = $('status');
  var result = $('result'), verdictEl = $('verdict'), tipsEl = $('tips'), timingsEl = $('timings');
  var photoLabel = $('photoLabel'), refWrap = $('refWrap'), refImg = $('ref');
  var refCache = null; // { target, url } — the reference also sent to the API

  var moreMode = false;
  function chipTargets() {
    var q = null;
    try { q = new URLSearchParams(window.location.search).get('text'); } catch (e) { q = null; }
    var out = [];
    Sulat.syllabify(q || 'mahal kita').forEach(function (w) {
      w.tokens.forEach(function (t) {
        if (out.indexOf(t.text) < 0) { out.push(t.text); }
      });
    });
    return out.length ? out : ['ma'];
  }
  function baseLetters() {
    return Object.keys(pack.glyphs).filter(function (g) { return g.indexOf('mark-') !== 0; });
  }
  var pack = null;
  var cleaned = null; // { canvas, dataURL } from SulatPhoto.clean
  var busy = false;

  function say(msg, isError) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
  }

  function oneToken(text) {
    var words = Sulat.syllabify(text);
    var tokens = [];
    words.forEach(function (w) { w.tokens.forEach(function (t) { tokens.push(t); }); });
    return tokens.length === 1 ? tokens[0] : null;
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('bad-image')); };
      img.src = url;
    });
  }

  photoInput.addEventListener('change', function () {
    var f = photoInput.files && photoInput.files[0];
    cleaned = null;
    seen.hidden = true;
    seen.removeAttribute('src');
    seenCap.textContent = 'Your script';
    result.hidden = true;
    if (!f) { return; }
    say('Cleaning up your photo…');
    // Let the status paint before the heavy clean-up runs.
    setTimeout(function () {
      loadImage(f).then(function (img) {
        var out = null;
        try { out = SulatPhoto.clean(img); } catch (e) { out = null; }
        finishClean(out);
      }).catch(function () {
        say('That photo couldn’t be read. Try again.', true);
      });
    }, 30);
  });

  function finishClean(out) {
    if (!out) {
      say('I couldn’t find your writing. Try a darker pen, good light, and fill the frame.', true);
      return;
    }
    cleaned = out;
    seen.src = out.dataURL;
    seen.hidden = false;
    seenCap.textContent = 'Your script';
    photoLabel.textContent = 'Retake photo';
    say('Ready. Press “Check my writing”.');
  }

  // Shows the reference (the same image sent to the API) as soon as a syllable is chosen.
  function refreshReference() {
    if (!pack) { return; }
    var target = (sylInput.value || '').trim().toLowerCase();
    if (!oneToken(target)) {
      refWrap.hidden = true;
      refCache = null;
      return;
    }
    renderReference(target).then(function (url) {
      if ((sylInput.value || '').trim().toLowerCase() !== target) { return; }
      refCache = { target: target, url: url };
      refImg.src = url;
      refImg.hidden = false;
      refWrap.hidden = false;
      refCap.textContent = 'Marina’s script';
    }).catch(function () {
      refWrap.hidden = true;
      refCache = null;
    });
  }

  function onSyllableChanged() {
    photoLabel.textContent = 'Take a photo';
    result.hidden = true;
    refreshReference();
  }

  // Draws the target syllable with the engine onto a solid white canvas: JPEG.
  function renderReference(target) {
    var words = Sulat.syllabify(target);
    var lay = Sulat.layout(pack, words, { pad: 110 });
    var host = document.createElement('div');
    host.setAttribute('style', 'position:absolute;left:-9999px;top:0;');
    document.body.appendChild(host);
    var ctrl;
    try {
      ctrl = Sulat.render(host, pack, lay, { ink: 26, dotInk: 38, ariaLabel: target + ' reference' });
      ctrl.showAll();
      var W = 768;
      var H = Math.round(W * lay.viewBox[3] / lay.viewBox[2]);
      ctrl.svg.setAttribute('width', W);
      ctrl.svg.setAttribute('height', H);
      var xml = new XMLSerializer().serializeToString(ctrl.svg);
      var url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml' }));
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(url);
          var c = document.createElement('canvas');
          c.width = W; c.height = H;
          var cx = c.getContext('2d');
          cx.fillStyle = '#fff';
          cx.fillRect(0, 0, W, H);
          cx.drawImage(img, 0, 0, W, H);
          host.parentNode.removeChild(host);
          resolve(c.toDataURL('image/jpeg', 0.92));
        };
        img.onerror = function () {
          URL.revokeObjectURL(url);
          if (host.parentNode) { host.parentNode.removeChild(host); }
          reject(new Error('bad-reference'));
        };
        img.src = url;
      });
    } catch (e) {
      if (host.parentNode) { host.parentNode.removeChild(host); }
      return Promise.reject(e);
    }
  }

  function readError(res, fallback) {
    return res.json().then(function (j) {
      return new Error((j && (j.error || (j.detail ? j.error + ' ' + j.detail : null))) || fallback);
    }).catch(function () {
      return new Error(fallback + ' (' + res.status + ')');
    });
  }

  function showResult(found) {
    result.hidden = false;
    verdictEl.className = '';
    tipsEl.innerHTML = '';
    if (found.verdict === 'good') {
      verdictEl.textContent = 'Magaling!';
      verdictEl.className = 'good';
    } else if (found.verdict === 'almost') {
      verdictEl.textContent = 'Almost!';
      verdictEl.className = 'almost';
    } else {
      verdictEl.textContent = 'Try again';
      verdictEl.className = 'retry';
    }
    (found.tips || []).forEach(function (t) {
      var li = document.createElement('li');
      li.textContent = t;
      tipsEl.appendChild(li);
    });
    timingsEl.textContent = found.ms != null ? 'Marina answered in ' + (found.ms / 1000).toFixed(1) + ' s' : '';
    say('');
    try { result.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    catch (e) { if (result.scrollIntoView) { result.scrollIntoView(); } }
  }

  checkBtn.addEventListener('click', function () {
    if (busy || !pack) { return; }
    var target = (sylInput.value || '').trim().toLowerCase();
    if (!oneToken(target)) {
      say('Type one syllable, e.g. ki.', true);
      return;
    }
    if (!cleaned) {
      say('Take a photo first. If the camera didn’t open, check camera permission and try again.', true);
      return;
    }
    busy = true;
    checkBtn.disabled = true;
    say('Thinking…');
    result.hidden = true;
    var refP = (refCache && refCache.target === target)
      ? Promise.resolve(refCache.url)
      : renderReference(target).then(function (refURL) {
        refCache = { target: target, url: refURL };
        refImg.src = refURL;
        refImg.hidden = false;
        refWrap.hidden = false;
        refCap.textContent = 'Marina’s script';
        return refURL;
      });
    refP.then(function (refURL) {
      return fetch('/api/paper', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: target, photo: cleaned.dataURL, reference: refURL })
      }).then(function (res) {
        if (!res.ok) { return readError(res, 'Paper check failed').then(function (e) { throw e; }); }
        return res.json();
      });
    }).then(function (found) {
      showResult(found);
    }).catch(function (err) {
      say('Something went wrong: ' + err.message, true);
    }).then(function () {
      busy = false;
      checkBtn.disabled = false;
    });
  });

  // Built with Muse Code: desk-camera mode for the glasses loop.
  // Photo mode above is unchanged. The desk camera polls the shared room,
  // and each new capture command runs the same clean -> reference -> /api/paper
  // path as a held photo, then posts the verdict back to the room.
  var roomInput = $('room'), deskBtn = $('desk'), preview = $('preview');
  var photoCard = $('photoCard'), refCap = $('refCap'), deskTarget = $('deskTarget'), moreBtn = $('moreLetters');
  var deskStatusEl = $('deskStatus');
  var desk = { on: false, timer: 0, lastCmd: null, skipFirst: false, stream: null, lock: null, working: false };

  function dsay(msg, isError) {
    deskStatusEl.textContent = msg;
    deskStatusEl.classList.toggle('error', !!isError);
  }

  var roomParams = new URLSearchParams(window.location.search);
  if (roomParams.get('room')) { roomInput.value = roomParams.get('room'); }

  function roomCode() {
    var c = (roomInput.value || '').trim().toUpperCase();
    return /^[A-Z0-9]{4,8}$/.test(c) ? c : null;
  }

  function stopDesk(silent) {
    desk.on = false;
    if (desk.timer) { clearInterval(desk.timer); desk.timer = 0; }
    if (desk.stream) {
      desk.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { /* already stopped */ } });
      desk.stream = null;
    }
    if (desk.lock) { try { desk.lock.release(); } catch (e) { /* already released */ } desk.lock = null; }
    preview.hidden = true;
    try { preview.srcObject = null; } catch (e) { /* older browser */ }
    deskBtn.textContent = 'Pair and turn on camera';
    $('bezel').hidden = true;
    desk.lastCmd = null;
    desk.skipFirst = false;
    photoCard.hidden = document.body.classList.contains('desk'); // desk page keeps the photo controls away
    deskTarget.hidden = true;
    seen.hidden = true;
    try { seen.removeAttribute('src'); } catch (e) { /* older browser */ }
    seenCap.textContent = 'Your script';
    cleaned = null;
    result.hidden = true;
    verdictEl.textContent = '';
    tipsEl.innerHTML = '';
    timingsEl.textContent = '';
    refWrap.hidden = true;
    refreshReference();
    if (!silent) { dsay('Desk camera off.'); }
  }

  function startDesk() {
    var code = roomCode();
    if (!code) { dsay('Type the room code shown in the glasses.', true); return; }
    if (!pack) { dsay('The stroke pack is not loaded yet. Wait a moment and try again.', true); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      dsay('This browser cannot open the camera. Try iPhone Safari or Chrome.', true);
      return;
    }
    dsay('Starting the camera…');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(function (s) {
      desk.stream = s;
      preview.srcObject = s;
      preview.hidden = false;
      $('bezel').hidden = false;
      var played = null;
      try { played = preview.play(); } catch (e) { played = null; }
      return (played && played.catch) ? played.catch(function () {}) : null;
    }).then(function () {
      desk.on = true;
      desk.lastCmd = null;
      desk.skipFirst = true;
      deskBtn.textContent = 'Stop camera';
      photoCard.hidden = true;
      result.hidden = true;
      verdictEl.textContent = '';
      tipsEl.innerHTML = '';
      timingsEl.textContent = '';
      deskTarget.hidden = true;
      refWrap.hidden = false;
      refImg.hidden = true;
      refCap.textContent = 'Waiting for the glasses…';
      if (desk.timer) { clearInterval(desk.timer); }
      desk.timer = setInterval(function () { pollRoom(code); }, 1000);
      pollRoom(code);
      if (navigator.wakeLock && navigator.wakeLock.request) {
        dsay('Room ' + code + '. Watching for the glasses…');
        navigator.wakeLock.request('screen').then(function (l) { desk.lock = l; }).catch(function () {});
      } else {
        dsay('Room ' + code + '. Watching for the glasses… Keep the screen on.');
      }
    }).catch(function () {
      stopDesk(true);
      dsay('Could not open the camera. Allow camera access and try again.', true);
    });
  }

  deskBtn.addEventListener('click', function () {
    if (desk.on) { stopDesk(); return; }
    startDesk();
  });

  function pollRoom(code) {
    if (!desk.on || desk.working) { return; }
    fetch('/api/room?code=' + encodeURIComponent(code), { cache: 'no-store' }).then(function (res) {
      return res.ok ? res.json() : null;
    }).then(function (room) {
      if (!desk.on || !room) { return; }
      var cmd = room.command;
      if (desk.skipFirst) {
        // First look at the room: remember whatever is already there (or nothing). Never check it.
        desk.skipFirst = false;
        desk.lastCmd = cmd ? cmd.id : null;
        return;
      }
      if (!cmd || cmd.id === desk.lastCmd) { return; }
      desk.lastCmd = cmd.id;
      handleCommand(code, cmd);
    }).catch(function () { /* the next tick retries */ });
  }

  function postResult(code, id, verdict, tips, ms) {
    return fetch('/api/room', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, action: 'result', id: id, verdict: verdict, tips: tips, ms: ms })
    }).catch(function () { /* the glasses time out with their own message */ });
  }

  function cameraLive() {
    return !!(desk.stream && desk.stream.getTracks().some(function (t) { return t.readyState === 'live'; }));
  }

  function answerCommand(code, cmd, verdict, tips, ms) {
    var found = { verdict: verdict, tips: tips, ms: ms };
    showResult(found);
    return postResult(code, cmd.id, found.verdict, found.tips, found.ms);
  }

  function handleCommand(code, cmd) {
    desk.working = true;
    dsay('Checking "' + cmd.target + '"…');
    deskTarget.textContent = 'Checking: ' + cmd.target;
    deskTarget.hidden = false;
    refWrap.hidden = false;
    refImg.hidden = true;
    refCap.textContent = 'Marina’s ' + cmd.target;
    result.hidden = false;
    verdictEl.textContent = 'Checking your writing…';
    tipsEl.innerHTML = '';
    timingsEl.textContent = '';
    var t0 = Date.now();
    var RETRY_TIP = 'I couldn’t check that one. Press Check again.';
    if (!pack || !oneToken(cmd.target)) {
      answerCommand(code, cmd, 'retry', [RETRY_TIP], Date.now() - t0);
      dsay('Could not check that one.', true);
      deskTarget.hidden = true;
      desk.working = false;
      return;
    }
    if (!cameraLive()) {
      stopDesk(true);
      answerCommand(code, cmd, 'retry', [RETRY_TIP], Date.now() - t0);
      dsay('The phone camera stopped. Tap Pair and turn on camera again.', true);
      desk.working = false;
      return;
    }
    var cleaned = null;
    try { cleaned = preview.videoWidth ? SulatPhoto.clean(preview) : null; } catch (e) { cleaned = null; }
    var noshow = { verdict: 'retry', tips: ['I couldn’t see your writing. Write darker and keep the paper in view.'], ms: Date.now() - t0 };
    if (!cleaned) {
      showResult(noshow);
      postResult(code, cmd.id, noshow.verdict, noshow.tips, noshow.ms);
      dsay('Done. Watching for the glasses…');
      deskTarget.hidden = true;
      desk.working = false;
      return;
    }
    seen.src = cleaned.dataURL;
    seen.hidden = false;
    seenCap.textContent = 'Your script';
    renderReference(cmd.target).then(function (refURL) {
      refImg.src = refURL;
      refImg.hidden = false;
      refWrap.hidden = false;
      return fetch('/api/paper', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: cmd.target, photo: cleaned.dataURL, reference: refURL })
      }).then(function (res) {
        if (!res.ok) { return readError(res, 'Paper check failed').then(function (e) { throw e; }); }
        return res.json();
      });
    }).then(function (found) {
      showResult(found);
      return postResult(code, cmd.id, found.verdict, found.tips || [], found.ms == null ? 0 : found.ms);
    }).catch(function (err) {
      answerCommand(code, cmd, 'retry', ['I couldn’t check that one. Press Check again.'], Date.now() - t0);
      dsay('Something went wrong: ' + err.message, true);
    }).then(function () {
      dsay('Done. Watching for the glasses…');
      deskTarget.hidden = true;
      desk.working = false;
    });
  }

  // The lock is released when the page hides; ask again on return while on duty.
  document.addEventListener('visibilitychange', function () {
    if (!desk.on || document.hidden) { return; }
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (l) { desk.lock = l; }).catch(function () {});
    }
  });

  function buildChips(list) {
    var box = $('chips');
    box.innerHTML = '';
    list.forEach(function (text) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = text;
      b.setAttribute('aria-pressed', text === sylInput.value.trim().toLowerCase() ? 'true' : 'false');
      b.addEventListener('click', function () {
        sylInput.value = text;
        var all = box.children;
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute('aria-pressed', all[i].textContent === text ? 'true' : 'false');
        }
        onSyllableChanged();
      });
      box.appendChild(b);
    });
  }
  buildChips(chipTargets());
  moreBtn.addEventListener('click', function () {
    moreMode = !moreMode;
    if (moreMode && !pack) {
      moreMode = false;
      say('Still loading the stroke pack…');
      return;
    }
    buildChips(moreMode ? baseLetters() : chipTargets());
    moreBtn.textContent = moreMode ? 'Fewer letters' : 'More letters';
  });
  sylInput.addEventListener('change', onSyllableChanged);

  (function () {
    var desk = document.body.classList.contains('desk');
    var q = new URLSearchParams(window.location.search);
    var text = q.get('text');
    $('modePhoto').setAttribute('aria-current', desk ? 'false' : 'true');
    $('modeDesk').setAttribute('aria-current', desk ? 'true' : 'false');
    if (text) { $('modePhoto').href = 'paper.html?text=' + encodeURIComponent(text); }
    if (desk) { photoCard.hidden = true; } else { $('deskCard').hidden = true; }
    Array.prototype.forEach.call(document.querySelectorAll(desk ? '.only-photo' : '.only-desk'), function (el) { el.hidden = true; });
    $('topBack').addEventListener('click', function () {
      if (window.history.length > 1) { window.history.back(); } else { window.location.href = 'index.html?view=phone'; }
    });
  })();

  Sulat.loadPack('packs/baybayin.json').then(function (p) {
    pack = p;
    refreshReference();
  }).catch(function (err) {
    say('Couldn’t load the stroke pack. Open this page from your Sulat site. (' + err.message + ')', true);
  });
})();
</script>
</body>
</html>
